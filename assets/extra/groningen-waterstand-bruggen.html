<title>Waterstand en bruggen Groningen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: kopbalk, daaronder een smalle kolom met witte kaarten op een lichtblauwgrijze ondergrond, zoals de bestaande Flagship Academy leeromgeving. */
:root{
  --bg:#EEF3F8; --card:#FFFFFF; --ink:#1B2540; --muted:#5F6B83; --line:#DCE4EE;
  --water:#CFE3F5; --waterline:#3E86C7; --accent:#E4792B; --accent-text:#BE5A0E; --accent-soft:#FDF1E7; --pill:#DCE8F3;
  --good:#2B8A4B; --good-soft:#E5F4EA; --bad:#C0392B; --bad-soft:#FBEAE7;
  --shadow:0 1px 2px rgba(27,37,64,.06),0 6px 18px rgba(27,37,64,.05);
  --font-head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626; --card:#18223A; --ink:#E8EDF7; --muted:#9BA7C0; --line:#2A3654;
    --water:#1F3A63; --waterline:#6BA8E6; --accent:#F08A3C; --accent-text:#F4A261; --accent-soft:#2B2218; --pill:#25324F;
    --good:#5CC784; --good-soft:#16301F; --bad:#FF8070; --bad-soft:#3A1E1B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --water:#1F3A63; --waterline:#6BA8E6;
  --bg:#0F1626; --card:#18223A; --ink:#E8EDF7; --muted:#9BA7C0; --line:#2A3654;
  --accent:#F08A3C; --accent-text:#F4A261; --accent-soft:#2B2218; --pill:#25324F;
  --good:#5CC784; --good-soft:#16301F; --bad:#FF8070; --bad-soft:#3A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-head);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0 0 .8em}
a{color:var(--accent-text);font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:15px;letter-spacing:.02em;flex:none}
.brand{min-width:0;flex:1 1 200px}
.brand b{display:block;font-family:var(--font-head);font-size:19px;line-height:1.2}
.brand span{display:block;font-size:12.5px;color:var(--muted)}
.brand span em{font-style:normal;color:var(--accent-text);font-weight:700}
.prog{display:flex;align-items:center;gap:10px;flex:none}
.bar{width:110px;height:8px;background:var(--pill);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.pct{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pillbtn{border:0;background:var(--pill);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.pillbtn[aria-current="true"]{background:var(--accent);color:#fff}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 56px}
.narrow{max-width:760px;margin:0 auto}
.crumbs{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.crumbs .pillbtn{display:inline-flex;gap:6px;align-items:center}
.crumbs small{color:var(--muted);font-weight:600;font-size:14px}
.eyebrow{color:var(--accent-text);font-weight:700;font-size:12.5px;letter-spacing:.04em;margin-bottom:6px}
.title{font-size:clamp(28px,5vw,40px);font-weight:700;margin-bottom:8px}
.lead{color:var(--muted);font-size:17px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:21px;font-weight:700;margin-bottom:10px}
.card h3{font-size:17px;font-weight:700;margin:14px 0 6px}
.card ul,.card ol{margin:.2em 0 .9em;padding-left:1.3em}
.card li{margin-bottom:.35em}
.call{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:11px 14px;margin:12px 0}
.call.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.call.good{background:var(--good-soft);border-left-color:var(--good)}
.call p:last-child{margin:0}
.steps{counter-reset:s;list-style:none;padding:0!important;margin:0}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);margin:0}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-head);font-weight:800}
.chlist{display:grid;gap:12px}
.ch{display:flex;gap:16px;align-items:center;width:100%;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.ch:hover{border-color:var(--accent)}
.ch .n{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--font-head);font-weight:800;color:var(--muted)}
.ch.done .n{background:var(--good);border-color:var(--good);color:#fff}
.ch b{display:block;font-family:var(--font-head);font-size:18px;line-height:1.25}
.ch span{display:block;font-size:13.5px;color:var(--muted)}
.ch .st{margin-left:auto;font-weight:700;font-size:13px;color:var(--muted);flex:none;text-align:right}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:12px 24px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:18px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:560px}
th{background:var(--bg);text-align:left;font-size:12.5px;letter-spacing:.03em;color:var(--muted);padding:9px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th.r,td.r{text-align:right}
tr.low td{background:var(--accent-soft)}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--pill)}
.tag.warn{background:var(--accent);color:#fff}
.figure{margin:12px 0}
.figure img{display:block;width:100%;max-width:520px;margin:0 auto;border-radius:12px;border:1px solid var(--line)}
.figure figcaption{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.scale{position:relative;height:84px;margin:18px 6px 6px}
.scale .line{position:absolute;left:0;right:0;top:34px;height:8px;border-radius:99px;background:var(--pill)}
.scale .rng{position:absolute;top:34px;height:8px;border-radius:99px;background:var(--accent);opacity:.45}
.scale .mk{position:absolute;top:22px;transform:translateX(-50%);text-align:center;font-size:12px;font-weight:700;white-space:nowrap}
.scale .mk::after{content:"";display:block;width:2px;height:32px;margin:2px auto 0;background:var(--ink)}
.scale .mk.up{top:0}.scale .mk.up::after{height:30px;margin-top:2px}
.scale .mk.dn{top:44px}.scale .mk.dn::after{display:none}
.scale .mk.dn::before{content:"";display:block;width:2px;height:12px;margin:0 auto 2px;background:var(--ink)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 6px;font-variant-numeric:tabular-nums}
.figgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.figgrid svg{display:block;width:100%;height:auto;max-width:420px;margin:0 auto;color:var(--ink)}
.figure2{margin:14px 0}
.figure2 figcaption{font-size:13.5px;color:var(--muted);margin-top:8px}
.formula{font-family:var(--font-head);font-size:clamp(18px,3.4vw,24px);font-weight:700;text-align:center;background:var(--accent-soft);border-radius:14px;padding:16px 12px;margin:10px 0}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:14px}
.field input,.field select{font:inherit;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field small{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.res{border-radius:14px;padding:16px 18px;margin-top:6px;border:2px solid var(--line)}
.res.ok{border-color:var(--good);background:var(--good-soft)}
.res.no{border-color:var(--bad);background:var(--bad-soft)}
.res.wait{background:var(--accent-soft);border-color:var(--accent)}
.res h3{font-size:22px;margin:0 0 6px}
.res .calc{font-variant-numeric:tabular-nums;font-size:15px}
/* quiz */
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qbar{height:8px;background:var(--pill);border-radius:99px;margin-bottom:18px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.qcard h2{font-size:clamp(20px,3.5vw,26px);margin-bottom:16px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{flex:none;width:32px;height:32px;border-radius:50%;background:var(--pill);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.tip{font-size:13px;color:var(--muted);margin-top:14px}
.score{font-family:var(--font-head);font-size:56px;font-weight:800;color:var(--accent-text);line-height:1}
.src{font-size:12.5px;color:var(--muted);margin-top:22px}
@media (max-width:560px){
  .bar{width:70px}
  .card{padding:16px}
  .qcard{padding:18px}
  .ch .st{display:none}
}
@media (prefers-reduced-motion:reduce){.bar i,.qbar i{transition:none}}
</style>

var LET=["A","B","C","D"];
function quiz(){
  var q=QZ[qs.ch][qs.k],n=QZ[qs.ch].length;

  h+='</div><div id="fb"></div><p class="tip">Tip: je kunt ook antwoorden met de toetsen A, B, C, D en doorgaan met Enter.</p></div>';

function pick(i){
  if(qs.ans!==null)return;
  var q=QZ[qs.ch][qs.k];qs.ans=i;if(i===q.c)qs.ok++;
  var b=app.querySelectorAll(".opt");
  for(var k=0;k<b.length;k++){b[k].disabled=true;if(k===q.c)b[k].classList.add("right");else if(k===i)b[k].classList.add("wrong");}
  var last=qs.k===QZ[qs.ch].length-1;
  document.getElementById("fb").innerHTML='<div class="call '+(i===q.c?'good':'bad')+'"><p><b>'+(i===q.c?'Goed!':'Niet helemaal.')+'</b> '+q.e+'</p></div><div class="row" style="margin-top:12px;justify-content:flex-end"><button type="button" class="btn" id="nx">'+(last?'Bekijk je score':'Volgende')+' →</button></div>';
  var nx=document.getElementById("nx");nx.focus();nx.onclick=next;
}
function next(){
  if(qs.ans===null)return;
  if(qs.k===QZ[qs.ch].length-1){var p=st.best[qs.ch];if(p==null||qs.ok>p)st.best[qs.ch]=qs.ok;save();go({n:"res"});}
  else{qs.k++;qs.ans=null;render();window.scrollTo(0,0);}
}
function result(){
  var n=QZ[qs.ch].length,h='<div class="crumbs"><button type="button" class="pillbtn" id="stop">Overzicht</button></div><div class="qcard" style="text-align:center"><div class="eyebrow">HOOFDSTUK '+(qs.ch+1)+' · '+CH[qs.ch].t.toUpperCase()+'</div><div class="score">'+qs.ok+'/'+n+'</div><h2 style="margin:10px 0">'+(qs.ok===n?"Alles goed!":(qs.ok>=2?"Goed gedaan.":"Lees het hoofdstuk nog een keer."))+'</h2><p>'+(qs.ok>=2?"Dit hoofdstuk telt mee in je voortgang.":"Haal minstens 2 van de 3 goed om dit hoofdstuk af te ronden.")+'</p><div class="row" style="justify-content:center"><button type="button" class="btn ghost" id="again">Opnieuw proberen</button><button type="button" class="btn" id="chn">'+(qs.ch<3?'Volgend hoofdstuk':'Naar het overzicht')+'</button></div></div>';
  app.innerHTML=h;
  document.getElementById("stop").onclick=function(){go({n:"home"});};
  document.getElementById("again").onclick=function(){qs={ch:qs.ch,k:0,ok:0,ans:null};go({n:"quiz"});};
  document.getElementById("chn").onclick=function(){if(qs.ch<3)go({n:"ch",i:qs.ch+1});else go({n:"home"});};
}
document.addEventListener("keydown",function(e){

function calc(){
  var b=BR[+document.getElementById("tb").value];
  var cm=parseFloat(document.getElementById("tc").value),bt=parseFloat(document.getElementById("th").value),mg=parseFloat(document.getElementById("tm").value);
  var out=document.getElementById("tr");
  if(isNaN(cm)||isNaN(bt)||isNaN(mg)){out.innerHTML='<div class="res wait"><h3>Vul alle velden in</h3></div>';return;}
  var w=cm/100,ruimte=b[4]-w,nodig=bt+mg/100,ok=ruimte>=nodig-1e-9;
  var warn="";
  if(Math.abs(cm)<10&&cm!==0)warn+='<div class="call bad"><p>Je vulde '+cm+' in. Waterinfo geeft centimeters. Bedoel je '+Math.round(cm*100)+' cm?</p></div>';
  else if(cm<30||cm>75)warn+='<div class="call bad"><p>Dit peil is ongewoon (meestal tussen 47 en 62 cm). Controleer je meting of kijk op de peilschaal.</p></div>';
  if(b[0]==="Sint Jansbrug")warn+='<div class="call"><p>De gegevens van de Sint Jansbrug moeten nog gecontroleerd worden. Controleer de brug voor je gaat.</p></div>';
  var verdict=ok?'Je past':'Je past niet';
  var adv=ok?'Er is genoeg ruimte, met marge.':(b[6]?'Dit is een vaste brug. Ga niet door.':'Laat de brug openen. Past je dan nog niet, ga niet door.');
  out.innerHTML=warn+'<div class="res '+(ok?'ok':'no')+'"><h3>'+verdict+'</h3><p class="calc">Ruimte: '+f2(b[4])+' − '+f2(w)+' = <b>'+f2(ruimte)+' m</b><br>Nodig: '+f2(bt)+' + '+f2(mg/100)+' = <b>'+f2(nodig)+' m</b></p><p style="margin:6px 0 0"><b>'+adv+'</b></p></div>';
}
document.getElementById("navHome").onclick=function(){go({n:"home"});};
document.getElementById("navTool").onclick=function(){go({n:"tool"});};
render();
})();
</script>
