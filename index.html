{id:'wet',t:'Wet- en regelgeving',kort:'BPR, CVO en documenten aan boord',p:8,
 intro:'Het kennen van de regels voor varen op de grachten: inzicht in vergunningen, snelheidslimieten, veiligheidsvoorschriften, milieuregels en de verantwoordelijkheden van handhavende instanties.',
 les:[
  {t:'Regels op het water',p:9,b:['In principe zijn alle regels die je hebt geleerd voor het **Klein Vaarbewijs** voldoende om dit examen te halen.','Fris daarom je kennis op over onder andere **verkeersborden, voorrangsregels, verlichting en scheepstypen** met het Klein Vaarbewijs-boek. Deze regels worden in de opleiding niet opnieuw volledig herhaald.','De focus ligt op het correct toepassen van de regels in de praktijk en het kunnen uitleggen van je keuzes tijdens het examen.']},
  {t:'BPR',p:9,b:['Het Binnenvaartpolitiereglement (BPR) geldt op de binnenwateren van **Nederland en de Waddenzee**.','Kennis van het BPR is nodig voor een veilige vaart en een vereiste voor het kwalificatiecertificaat ‘Schipper open rondvaartboot’.','**Het BPR moet altijd aan boord zijn**, digitaal of op papier.','Je hoeft niet alle regels uit je hoofd te kennen, maar je moet wel weten waar je informatie **terugvindt** en hoe je het reglement gebruikt.']},
  {t:'Scheepsadministratie',p:10,b:['Alle documenten en registraties over **het schip zelf**: de identiteit van het schip, waarvoor het gebruikt mag worden en onder welke voorwaarden. De administratie laat zien dat het schip **goedgekeurd, vergund en veilig inzetbaar** is.','Hier horen onder andere bij:',['**CVO** (Certificaat van Onderzoek) en eventueel CBB: leidend document voor keuring, uitrusting en vaargebied','**Exploitatievergunning** (bijvoorbeeld A1)','**Logboek** van het schip. Bij open sloepen geen vaartijdenboek, maar wel een logboek waarin staat dat de boot vaart (zoals L1nda of Shiftbase)'],'Als schipper moet je weten welke administratie van toepassing is, waar die aan boord ligt, en kunnen uitleggen wat het schip wel en niet mag.',{tip:'Bij twijfel over gebruik, uitrusting of vaargebied is het **CVO altijd leidend**.'}]},
  {t:'Verordening 2010',p:11,b:['Een lokale wet van de **gemeente Amsterdam**. Geldt alleen op de Amsterdamse binnenwateren, zoals de grachten, het IJ en de Amstel.','De verordening beschrijft hoe het water gebruikt mag worden en onder welke voorwaarden:',['aanvragen van vergunningen','gebruik van het vaarwater','overlast, woonboten','ligplaatsen bedrijfsvaartuigen','vervoer van passagiers (waaronder rondvaart) en vergunningen daarvoor','vervoer van goederen, waaronder gevaarlijke stoffen','pleziervaartuigen'],'Kennis hiervan is raadzaam voor bedrijfsmatig varen in Amsterdam, maar het is **niet opgenomen in de exameneisen van het CBR**.']},
  {t:'CVO en CBB',p:11,b:['Het CVO (Certificaat van Onderzoek, soms CBB genoemd) vormt de technische en juridische basis van het schip. Het laat zien dat het schip is goedgekeurd en onder welke **voorwaarden** het mag worden ingezet.','Het CVO geeft onder andere informatie over:',['het **vaargebied** waarvoor het schip is goedgekeurd','de maximale belading en het toegestane **gebruik**','de verplichte **veiligheidsuitrusting**','de **geldigheidsduur** van de keuring'],'Het CBB bevat aanvullende of specifieke voorwaarden voor het schip en de inrichting.','De schipper moet weten waar het CVO (en eventueel het CBB) aan boord ligt, en het kunnen **lezen, interpreteren en toepassen**. Bij twijfel over uitrusting (lijnen, brandblussers, anker), gebruik of vaargebied is het CVO leidend, tijdens de vaart en bij een controle of examen.',{tip:'Tijdens het CBR-examen kun je gevraagd worden: aanwijzen waar het CVO ligt, uitleggen wat erin staat, laten zien tot wanneer het geldig is en toelichten welke beperkingen gelden.'}]},
  {t:'Documenten aan boord',p:13,b:['Documenten mogen op papier of digitaal aan boord zijn, zolang ze **direct raadpleegbaar** zijn.','Verplicht:',['Het CVO','Vaarbewijs of EU-certificaat','Marifoonbewijs','BPR (digitaal of fysiek)','Waterkaart (digitaal of fysiek)'],'Daarnaast moet je basiskennis hebben van **AIS**, de **tachograaf** en **Vesselfinder**. Let op: Vesselfinder is géén waterkaart en vervangt geen nautische kaart.']}
 ],

{id:'gebied',t:'Kennis vaargebied',kort:'Zones, waterstand en vaarweginformatie',p:15,
 intro:'Als schipper moet je weten waar je vaart en wat daar wel en niet is toegestaan. Het gaat niet alleen om de route, maar ook om inzicht in zones, waterstand, bruggen en actuele vaarweginformatie.',
 les:[
  {t:'Zones (zone 1 t/m 4)',p:16,b:['Het vaarwater in Nederland is ingedeeld in zones. Die geven aan onder welke omstandigheden een schip veilig mag varen, op basis van golfhoogte, windinvloed en beschutting.',['**Zone 1 en 2**: open en ruige wateren met veel wind en golfslag. Niet bedoeld voor open rondvaartboten.','**Zone 3**: ruimer binnenwater, zoals grote meren en brede wateren. Er is beschutting, maar wind en passerende schepen kunnen golfslag geven.','**Zone 4**: beschut binnenwater, zoals grachten, kanalen en rivieren. Hier varen open rondvaartboten, waaronder op de Amsterdamse grachten.'],{tip:'De zone waarin een schip mag varen staat altijd **in het CVO**. Je mag alleen in de goedgekeurde zone varen; dat heeft direct te maken met de veiligheid en stabiliteit van het schip.'}]},
  {t:'Waterstand en vaargedrag',p:17,b:['De waterstand heeft directe invloed op het varen. Bij hoge of lage waterstand verandert de doorvaarthoogte bij bruggen en kan er minder ruimte zijn in smalle vaarwegen. Ook aan- en afmeren kan lastiger worden.','De waterstand in Amsterdam wordt gemeten ten opzichte van het **Normaal Amsterdams Peil (NAP)**. De standaard waterstand op de grachten is ongeveer **−40 cm ten opzichte van NAP**.','De actuele waterstand vind je:',['op de website van **Rijkswaterstaat**, meetpunt **Surinamekade**','via **Teletekst pagina 720**'],'Staat het water hoger, dan is de ruimte onder een brug kleiner.']},
  {t:'Vaarweginformatie',p:18,b:['Je hoeft niet alles uit je hoofd te weten, maar wel waar je informatie vindt.',['**Nautische (water)kaarten**: vaarwegen, snelheden, zones, doorvaarthoogtes en meldpunten.','**Vaarweginformatie.nl**: actuele stremmingen, waterstanden, werkzaamheden en bijzonderheden op het vaarwater.'],'Het CBR kan vragen waar je deze informatie vandaan haalt en hoe je die gebruikt bij het plannen van een route.']},
  {t:'Route- en tijdsplanning',p:18,b:['Rondvaartboten varen vaak volgens een vast schema. Maak daarom een goede inschatting van de **benodigde vaartijd**. Daarbij spelen afstand en vaarsnelheid mee, maar ook drukte, wachttijden bij bruggen en knelpunten.','Je moet kunnen uitleggen **waarom** je voor een route kiest en hoe je tot een realistische tijdsplanning komt. Het CBR kijkt vooral naar **inzicht en onderbouwing**.']},
  {t:'Bruggen en kunstwerken',p:19,b:['Een **kunstwerk** is een door mensen aangelegde constructie in of over het water: bruggen, sluizen, kades, stuwen en steigers. Ze kunnen beperkingen geven in hoogte, breedte of doorgang.','Let bij het plannen van een route op:',['doorvaarthoogtes van bruggen','eventuele brugopeningen','openingstijden','het marifoonkanaal of telefoonnummer om een brugopening aan te vragen'],'In drukke gebieden en smalle passages denk je vooruit over wachttijden, tegenliggers en de manoeuvres die je moet uitvoeren.']}
 ],
 cbr:['Waar kun je actuele vaarweginformatie vinden?','Wat betekent de waterstand voor jouw vaargedrag?','Hoe controleer je de actuele waterstand?','Wat zijn de belangrijkste risico’s in jouw vaargebied?','Wat moet je weten over bruggen voordat je een route gaat varen?','Wat betekenen de zones 1 t/m 4 en waarom zijn die belangrijk?','Als de waterstand hoger is, zijn bruggen dan hoger of lager in realiteit?'],
 v:[
  {q:'In welke zone varen open rondvaartboten, zoals op de Amsterdamse grachten?',a:['Zone 1','Zone 2','Zone 3','Zone 4'],goed:3,vast:true,u:'Zone 4 is beschut binnenwater zoals grachten, kanalen en rivieren. Daar varen open rondvaartboten.',p:16},
  {q:'Wat zijn zone 1 en 2?',a:['Open en ruige wateren met veel wind en golfslag','Beschut binnenwater zoals grachten','Havens en jachthavens','Wateren waar alleen roeiboten mogen varen'],u:'Zone 1 en 2 zijn open en ruige wateren. Ze zijn niet bedoeld voor open rondvaartboten.',p:16},
  {q:'Wat kenmerkt zone 3?',a:['Ruimer binnenwater, zoals grote meren, waar toch golfslag kan ontstaan','Open zee met hoge golven','Smalle grachten zonder golfslag','Alleen sluizen en havens'],u:'Zone 3 is ruimer binnenwater. Er is beschutting, maar wind en passerende scheepvaart kunnen golfslag geven.',p:16},
  {q:'Waar staat in welke zone een schip mag varen?',a:['In het CVO','Op vaarweginformatie.nl','In het logboek','In de Verordening 2010'],u:'De zone waarin een schip mag varen staat altijd vermeld in het CVO.',p:16},
  {q:'Ten opzichte waarvan wordt de waterstand in Amsterdam gemeten?',a:['Het Normaal Amsterdams Peil (NAP)','De bodem van de gracht','De hoogte van de kade','Het hoogste punt van de brug'],u:'De waterstand wordt gemeten ten opzichte van het Normaal Amsterdams Peil (NAP).',p:17},
  {q:'Wat is ongeveer de standaard waterstand op de grachten?',a:['−40 cm ten opzichte van NAP','+40 cm ten opzichte van NAP','Precies 0 cm NAP','−1 meter ten opzichte van NAP'],u:'De standaard waterstand op de grachten is ongeveer −40 cm ten opzichte van NAP.',p:17},
  {q:'Waar vind je de actuele waterstand?',a:['Op de site van Rijkswaterstaat (meetpunt Surinamekade) of Teletekst pagina 720','Op Vesselfinder','In het CVO','In het BPR'],u:'Kijk bij Rijkswaterstaat met meetpunt Surinamekade, of op Teletekst pagina 720.',p:17},
  {q:'Het water staat hoger dan normaal. Wat betekent dat voor bruggen?',a:['Er is minder ruimte onder de brug','Er is meer ruimte onder de brug','Er verandert niets','Bruggen gaan dan automatisch open'],u:'De waterstand verandert de doorvaarthoogte. Staat het water hoger, dan is de ruimte onder een brug kleiner.',p:17},
  {q:'Welke actuele informatie vind je op vaarweginformatie.nl?',a:['Stremmingen, waterstanden, werkzaamheden en bijzonderheden','Passagierslijsten van rederijen','De keuringsdatum van je brandblusser','Vertrektijden van de rederij'],u:'Vaarweginformatie.nl geeft actuele informatie zoals stremmingen, waterstanden, werkzaamheden en bijzonderheden.',p:18},
  {q:'Wat staat er op een nautische (water)kaart?',a:['Vaarwegen, snelheden, zones, doorvaarthoogtes en meldpunten','De stremmingen van vandaag','Wie er aan boord is','De waterstand van dit moment'],u:'Op nautische kaarten staan vaarwegen, snelheden, zones, doorvaarthoogtes en meldpunten.',p:18},
  {q:'Wat is een kunstwerk in de scheepvaart?',a:['Een aangelegde constructie in of over het water, zoals een brug, sluis, kade, stuw of steiger','Een schilderij aan boord','Een natuurlijk eiland','Een bezienswaardigheid langs de gracht'],u:'Een kunstwerk is een door mensen aangelegde constructie in of over het water die invloed heeft op de scheepvaart.',p:19},
  {q:'Waar let je op bij bruggen als je een route plant?',a:['Doorvaarthoogte, brugopeningen, openingstijden en het marifoonkanaal of telefoonnummer','Alleen de naam van de brug','De kleur van de brug','Het bouwjaar van de brug'],u:'Let op doorvaarthoogtes, brugopeningen, openingstijden en hoe je een opening aanvraagt (marifoonkanaal of telefoon).',p:19},
  {q:'Waar kijkt het CBR vooral naar bij je route- en tijdsplanning?',a:['Naar inzicht en onderbouwing','Of je zo snel mogelijk vaart','Alleen naar de lengte van de route','Of de route precies een uur duurt'],u:'Het CBR kijkt niet alleen naar kennis, maar vooral naar inzicht en onderbouwing.',p:18},
  {q:'Wat speelt mee bij het inschatten van de benodigde vaartijd?',a:['Afstand, vaarsnelheid, drukte, wachttijden bij bruggen en knelpunten','Alleen de afstand','Alleen het aantal passagiers','Alleen de lengte van het schip'],u:'Afstand en snelheid spelen mee, maar ook drukte, wachttijden bij bruggen en knelpunten in het vaargebied.',p:18}
 ]},
{id:'reis',t:'Voorbereiding reis',kort:'Rondgang schip en vaarklaar maken',p:21,
 intro:'Een goede vaart begint vóórdat je losgooit. Als schipper ben je verantwoordelijk voor de staat van het schip en de veiligheid van je passagiers. Daarom controleer je vóór vertrek altijd het schip op vaste onderdelen.',
 les:[
  {t:'Rondgang schip',p:22,b:['Tijdens de rondgang laat je zien dat je het schip kent, veilig werkt en begrijpt wat je controleert. Het gaat niet alleen om aanwijzen, maar vooral om **uitleggen wat je doet en waarom**. Je benoemt hardop wat je controleert en laat het zien aan de examinator.','Er zijn vier hoofdonderdelen:',['**Salon**: schoon schip maken','**Stuurhuis**: onder andere je dashboard','**Motorruimte**: onder het luik','**Schroef**'],{img:'rondgang',alt:'Bovenaanzicht van het schip met de vier onderdelen: salon, stuurhuis, motorruimte en schroef'}]},
  {t:'Het stuurhuis',p:23,b:['Voordat je losgooit controleer je de bediening en systemen:',['**Gas** vooruit en achteruit slaan (gevoel en reactie controleren)','**AIS** aan en correct ingesteld?','**Navigatieverlichting**','**Marifoon(s)** inschakelen en juiste kanaal','**Stuurwiel** (vrij bewegen, geen speling)','**Hydrauliek**','**Hoorn** / geluidssein testen','**Accu- of batterijlading**','**Roeruitslagmeter**','**Snelheidsmeter** (niet aanwezig? Gebruik een navigatie-app als alternatief)','**Bilgepomp** (automatisch en handmatig indien mogelijk)'],{tip:'Alles **benoemen** en zichtbaar maken. Niet alleen zeggen “dit werkt”, maar ook laten zien dat het werkt.'}]},
  {t:'Motorruimte',p:24,b:['Open de motorruimte veilig (bijvoorbeeld het luik onder de stoel). Controlepunten:',['Is de **motorruimte droog**?','Geen olie- of brandstoflekkage zichtbaar?','Nogmaals de **bilge** controleren','Slangen en verbindingen','**Accu’s** visueel controleren'],'Schroefas:',['Controle op lekkage bij de **schroefas**','Uitleg over **smering**: watergesmeerd of vetgesmeerd','Aansluiting **tachograaf** op de aandrijfas'],'Je moet kunnen uitleggen waarom smering belangrijk is: het voorkomt **oververhitting en slijtage**.']},
  {t:'Schroef en aandrijving',p:25,b:['Laat zien dat je begrijpt hoe de schroef werkt: wat is de draairichting en hoe controleer je dat?','De beste manier: open het **luik van de motorruimte** en kijk **met weinig gas** hoe de **schroefas** draait.',{tip:'Een **rechtsdraaiende** schroefas (met een rechtsdraaiende schroef) draait bij **vooruit** varen **rechtsom** (met de klok mee) en bij **achteruit** varen **linksom** (tegen de klok in). Een linksdraaiende as werkt precies andersom.'},'Andere manieren om het te controleren:',['Achteruit slaan en kijken naar de wielwerking (**hekwiel-effect**)','De bladen bekijken (indien zichtbaar)'],{img:'schroef',alt:'Schroef met drie bladen en rechtse draairichting'}]},
  {t:'Salon / passagiersgedeelte',p:26,b:['Hier verblijven de passagiers. Je controleert of het schip veilig, netjes en gebruiksklaar is:',['Staat van banken en **zitplaatsen**','**Losliggende voorwerpen**','Veiligheid van relingen en instap','Aanwezigheid en bereikbaarheid van **reddingsmiddelen**','**Brandblusser** op de juiste plek','Algemene **netheid en orde**'],'Passagiers moeten veilig kunnen zitten **en zich veilig kunnen verplaatsen**. Obstakels of losse objecten verwijder je vóór vertrek.']},
  {t:'Checklist: schip vaarklaar maken',p:66,b:['**Administratie**: CVO aanwezig en geldig · vergunning(en) in orde · vaarbewijs en marifoonbewijs · logboek ingevuld · BPR aan boord.','**Voor vertrek**: route en vaargebied bekend · waterstand gecontroleerd · bruggen en bijzonderheden bekend.','**Salon**: schip opgeruimd (zeeklaar) · geen losse spullen · tafels en stoelen vastgezet · verlichting werkt · toilet schoon (indien aanwezig).','**Stuurhuis**: voortstuwing vooruit en achteruit · boegschroef (indien aanwezig) · stuurinrichting · verlichting · marifoon(s) op juiste kanaal · AIS · hoorn · accu’s geladen · noodbesturing bekend · goed zicht rondom (360 graden).','**Motorruimte**: droog en schoon · geen lekkages · oliepeil · koelvloeistof · slangen en verbindingen · bilge en pomp.','**Schroef en aandrijving**: schroef vrij van vuil, touw of plastic · schroefas en smering · draairichting bekend · hydrauliekolie.','**Veiligheid**: reddingsvesten voor alle passagiers · opblaasbare reddingsvesten voor bemanning · brandblusser gekeurd en op druk · EHBO-doos compleet · pikhaak · nooduitgangen vrij · reddingsmiddelen bereikbaar.']}
 ],
 cbr:['Wat controleer je voordat je losgooit en waarom is dat belangrijk?','Waar let je op bij het controleren van de motorruimte vóór vertrek?','Hoe controleer je of je schroef en aandrijving correct functioneren?','Wat doe je als je bij de controle water in de bilge aantreft?','Hoe controleer je de draairichting van je schroef en waarom moet je dat weten?','Welke systemen controleer je in het stuurhuis voordat je vertrekt?','Wat betekent “schoon schip maken” en waarom hoort dat bij de reisvoorbereiding?','Wat controleer je in het passagiersgedeelte voordat er gasten aan boord komen?'],
 v:[
  {q:'Wat zijn de vier hoofdonderdelen van de rondgang over het schip?',a:['Salon, stuurhuis, motorruimte en schroef','Kade, brug, sluis en steiger','Boeg, anker, mast en zeil','Kajuit, keuken, toilet en dek'],u:'De rondgang bestaat uit salon, stuurhuis, motorruimte en schroef.',p:22},
  {q:'Wat is belangrijk tijdens de rondgang met de examinator?',a:['Hardop benoemen wat je controleert en laten zien dat het werkt','Snel alles aanwijzen zonder uitleg','Alleen de motor starten','Zeggen “dit werkt” zonder het te laten zien'],u:'Het gaat vooral om uitleggen wat je doet en waarom. Niet alleen zeggen dat het werkt, maar het ook laten zien.',p:23},
  {q:'Waar let je op bij het stuurwiel?',a:['Dat het vrij beweegt en geen speling heeft','Dat het een mooie kleur heeft','Dat het zwaar draait','Dat er een hoes omheen zit'],u:'Het stuurwiel moet vrij bewegen en mag geen speling hebben.',p:23},
  {q:'Er is geen snelheidsmeter aan boord. Wat doe je?',a:['Een navigatie-app gebruiken als alternatief','Niet varen','De snelheid op gevoel schatten','Een andere schipper om de snelheid vragen'],u:'Is er geen snelheidsmeter, gebruik dan een navigatie-app als alternatief.',p:23},
  {q:'Welke controle hoort bij de motorruimte?',a:['Droog, geen olie- of brandstoflekkage, bilge, slangen en verbindingen, accu’s','Reddingsvesten tellen','Het marifoonkanaal instellen','De passagiers instructies geven'],u:'In de motorruimte controleer je of alles droog is, er geen lekkage is, en bekijk je bilge, slangen, verbindingen en accu’s.',p:24},
  {q:'Waarom is smering van de schroefas belangrijk?',a:['Het voorkomt oververhitting en slijtage','Het geeft een mooier geluid','De schroef draait er sneller door','Het bespaart brandstof'],u:'Je moet kunnen uitleggen dat smering oververhitting en slijtage voorkomt.',p:24},
  {q:'Hoe kan een schroefas gesmeerd zijn?',a:['Watergesmeerd of vetgesmeerd','Luchtgekoeld of oliegekoeld','Met kraanwater uit de salon','Smering is niet nodig'],u:'Een schroefas is watergesmeerd of vetgesmeerd.',p:24},
  {q:'Hoe controleer je de draairichting van de schroef?',a:['Luik openen en met weinig gas naar de schroefas kijken. Een rechtsdraaiende as draait bij vooruit varen rechtsom (met de klok mee) en bij achteruit linksom (tegen de klok in).','Luik openen en met weinig gas naar de schroefas kijken. Een rechtsdraaiende as draait bij vooruit varen linksom (tegen de klok in) en bij achteruit rechtsom (met de klok mee).','Vol gas vooruit geven en naar het kielwater achter de boot kijken','De draairichting opzoeken in het CVO'],u:'Open het luik van de motorruimte en kijk met weinig gas naar de schroefas. Een rechtsdraaiende schroefas (met een rechtsdraaiende schroef) draait bij vooruit varen rechtsom (met de klok mee) en bij achteruit varen linksom (tegen de klok in).',p:25},
  {q:'Er liggen losse spullen in het passagiersgedeelte. Wanneer ruim je die op?',a:['Vóór vertrek','Tijdens de vaart','Na afloop van de vaart','Dat hoeft niet, passagiers letten zelf op'],u:'Obstakels of losse objecten verwijder je vóór vertrek, zodat passagiers veilig kunnen zitten en zich verplaatsen.',p:26},
  {q:'Wat hoort bij “schoon schip maken” in het salon?',a:['Schip opgeruimd, geen losse spullen, tafels en stoelen vastgezet','De romp van buiten poetsen','De motor wassen','Pas na afloop de ramen zemen'],u:'Schoon schip maken betekent: opgeruimd (zeeklaar), geen losse spullen en tafels en stoelen vastgezet.',p:66},
  {q:'Waarop is de tachograaf aangesloten?',a:['Op de aandrijfas','Op de marifoon','Op de accu','Op het stuurwiel'],u:'Bij de controle van de schroefas hoort ook de aansluiting van de tachograaf op de aandrijfas.',p:24},
  {q:'Welk punt staat op de checklist van het stuurhuis?',a:['Goed zicht rondom (360 graden)','Tafels en stoelen vastgezet','Toilet schoon','Oliepeil in orde'],u:'Op de checklist van het stuurhuis staat onder andere: goed zicht rondom (360 graden).',p:67}
 ]},
{id:'nav',t:'Navigatie',kort:'Plaats op het water, aanmeren en bochten',p:28,
 intro:'Navigatie gaat over het beheersen van het schip: zelfstandig aan- en afmeren, koersvast varen en de juiste vaartechniek toepassen. Daarbij schat je snelheid en positie goed in, houd je rekening met andere schepen en reageer je rustig op situaties op het water.',
 les:[
  {t:'Extra: de boegschroef',p:30,b:['Veel sloepen hebben een boegschroef. Die kan helpen bij manoeuvreren op lage snelheid. **Binnen de SOR-opleiding hoort de boegschroef niet bij de hoofdbesturing van het schip.**','De hoofdbesturing van onze open rondvaartboten bestaat uit het hydraulische **roer** en de **voortstuwingsschroef**. Die staan in het CVO en daarop is het schip gekeurd. De boegschroef is een aanvullend hulpmiddel.',{tip:'Je moet het schip altijd volledig **zonder boegschroef** kunnen manoeuvreren. Flagship Academy kan niet garanderen dat er tijdens lessen, generale repetities of examens een werkende boegschroef is.'}]},
  {t:'1. Plaats op het water',p:31,b:['Om je plaats te bepalen deel je de waterweg op in banen: eerst doormidden, en daarna de baan waarop je vaart weer in tweeën. De lichte stippellijn is je ideale plaats.',{img:'plaats',alt:'Vier stappen: de waterweg, verdeel, verdeel verder, je plaats'},{tip:'Elke situatie is anders; gebruik dit als uitgangspunt. Hoe smaller de waterweg, hoe dichter je bij de **stuurboordwal** zult moeten varen.'}]},
  {t:'2. Aanmeren zonder wind',p:32,b:[['**Voorbereiding**: vaar rustig op de kant af. Mik met de punt van de boot net achter de kikker waar je wilt aanmeren.','**Stoppen**: stop de boot net voordat je bij de kant bent. Zodra de boot stilligt, draai je het roer naar stuurboord.','**Draaien**: door zachtjes gas te geven laat je de boot draaien. Dreig je te dicht bij de kant te komen, corrigeer dan even in z’n achteruit.'],{img:'aanmeren',alt:'Aanmeren zonder wind in drie stappen'},{tip:'Bij een **rechtsdraaiende schroef** draait je achterschip naar **bakboord** als je achteruit slaat. Bij aanmeren aan bakboord verkleint dat de hoek met de kade tijdens het afstoppen. Aan stuurboord kun je met een kleinere hoek naderen en beweegt de kop bij het afstoppen meer naar de kade.'}]},
  {t:'2. Aanmeren met wind',p:33,b:[['**Lagerwal** (wind naar de kant): kleine hoek als het kan, niet strak langs de kant. Leg de boot bijna parallel stil met wat ruimte; je waait er vanzelf naartoe.','**Wind van de kant af**: neem een grotere hoek dan normaal, anders waai je te snel weg. Pas op dat je niet omwaait als je eerst een achterlijn zet. Gebruik eventueel een voorspring; leg die klaar met de lus achterin.','**Wind van voren**: kleine hoek naar je bestemming en stuur de kop naar de kant. Pas op voor omwaaien bij een achterlijn; eventueel een voorspring.','**Wind van achteren (corrigeren)**: kleine hoek, rustig naar je bestemming. Leg eerst een achterlijn en laat de wind het voorschip bijleggen.'],{img:'aanmeren-wind',alt:'Aanmeren met wind: lagerwal, stoppen, wind van voren, corrigeren'}]},
  {t:'3. Afvaren',p:34,b:[['**Achterkant weg van de kade**: draai het stuurwiel volledig naar bakboord. Met zachtjes gas vooruit beweegt de achterkant weg van de kade. Let op je punt.','**Ruimte maken**: vaar een paar meter achteruit, zodat er ruimte is voor je punt.','**Wegvaren**: stuur volledig naar stuurboord, draai zachtjes weg, zet het roer recht zodra je op koers zit en vaar rechtdoor weg.'],{img:'afvaren',alt:'Afvaren in drie stappen'}]},
  {t:'4. Bocht met vaart',p:35,b:['Bij een ruime bocht hoef je de boot niet stil te leggen. Een bocht met vaart betekent: met **gedoseerde snelheid**, niet met hoge snelheid.',['**Open varen**: zorg dat je zo vroeg mogelijk bent uitgelijnd met de brug, zodat je er recht doorheen vaart.','**Te krap**: je ziet niet wat er aan de andere kant gebeurt en moet onder de brug nog corrigeren. De kans op schade is groot. Zorg dat je de situatie altijd kunt oplossen door de boot stil te leggen.'],{img:'bocht',alt:'Bocht open varen tegenover te krap'},{tip:'Onder de brug: neem een punt in de verte om op af te sturen, dan ga je niet slingeren. Neem de tijd, gebruik weinig gas en maak weinig vaart; het moet ook voor de gasten een comfortabele bocht zijn.'}]},
  {t:'Speciale verrichtingen',p:63,b:['Deze opdrachten kunnen tijdens het examen gevraagd worden:',['Keren op nauw vaarwater','Achteruit door een brug varen','Een MOB-procedure uitvoeren','Vijf scheepslengtes achteruit varen','Afvaren van hoge wal of lage wal','Aanmeren','Voor een brug stilleggen en het schip gaande houden']]}
 ],
 cbr:['Waarom is het belangrijk om een brug “open” te varen?','Wat is schroefwerking en hoe beïnvloedt dit jouw manoeuvres?','Waarom maak je bij manoeuvres meestal zo min mogelijk vaart?','Waar let je op bij het aanmeren van een schip met wind?','Hoe kun je schroefwerking in je voordeel gebruiken?'],
 v:[
  {q:'Hoort de boegschroef bij de hoofdbesturing in de SOR-opleiding?',a:['Nee, het is een aanvullend hulpmiddel; je moet ook zonder kunnen manoeuvreren','Ja, je moet hem altijd gebruiken','Ja, hij is verplicht bij het aanmeren','Alleen tijdens het examen'],u:'De boegschroef hoort niet bij de basisbesturing en wordt buiten beschouwing gelaten. Je moet het schip zonder boegschroef kunnen manoeuvreren.',p:30},
  {q:'Waaruit bestaat de hoofdbesturing van de open rondvaartboten?',a:['Het hydraulische roer en de voortstuwingsschroef','De boegschroef en het roer','De boegschroef en de schroef','Alleen de boegschroef'],u:'De hoofdbesturing bestaat uit het hydraulische roer en de voortstuwingsschroef, zoals vermeld in het CVO.',p:30},
  {q:'Hoe bepaal je je ideale plaats op het water?',a:['Waterweg doormidden delen, en je eigen baan nog eens in tweeën','Altijd precies in het midden van de waterweg varen','Zo dicht mogelijk langs de bakboordwal','Dat maakt niet uit zolang je snel vaart'],u:'Deel de waterweg doormidden en daarna je eigen baan nog eens in tweeën. Daar ligt je ideale plaats.',p:31},
  {q:'De waterweg wordt smaller. Wat betekent dat voor je plaats?',a:['Je vaart dichter bij de stuurboordwal','Je vaart dichter bij de bakboordwal','Je vaart in het midden','Je vaart sneller om er snel doorheen te zijn'],u:'Hoe smaller de waterweg, hoe dichter je bij de stuurboordwal zult moeten varen.',p:31},
  {q:'Aanmeren zonder wind: waar mik je met de punt van de boot?',a:['Net achter de kikker waar je wilt aanmeren','Precies op de kikker','Ver vóór de kikker','Midden op de gracht'],u:'Vaar rustig op de kant af en mik met de punt net achter de kikker waar je wilt aanmeren.',p:32},
  {q:'Aanmeren zonder wind: de boot ligt net voor de kant stil. Wat doe je?',a:['Roer naar stuurboord en met zachtjes gas de boot laten draaien','Roer naar bakboord en vol gas','De motor uitzetten','Vol gas achteruit'],u:'Zodra de boot stilligt draai je het roer naar stuurboord en laat je de boot met zachtjes gas draaien.',p:32},
  {q:'Je hebt een rechtsdraaiende schroef en slaat achteruit. Wat doet het achterschip?',a:['Het draait naar bakboord','Het draait naar stuurboord','Het gaat recht achteruit','Er gebeurt niets'],u:'Bij een rechtsdraaiende schroef draait het achterschip naar bakboord als je achteruit slaat.',p:32},
  {q:'Hoe meer je aan bij lagerwal (de wind waait je naar de kant)?',a:['Kleine hoek, bijna parallel stilleggen met wat ruimte; je waait er vanzelf naartoe','Met een grote hoek hard op de kant af','Eerst de voorlijn vastmaken en dan vol gas','Wachten tot de wind draait'],u:'Bij lagerwal leg je de boot bijna parallel stil met een beetje ruimte. De wind drukt je vanzelf tegen de kant.',p:33},
  {q:'De wind waait van de kant af. Hoe meer je aan?',a:['Met een grotere hoek dan normaal, eventueel met een voorspring','Met een zo klein mogelijke hoek','Parallel aan de kant stilleggen','Zo snel mogelijk aanvaren'],u:'Neem een grotere hoek dan normaal, anders waai je te snel weg. Pas op voor omwaaien en gebruik eventueel een voorspring.',p:33},
  {q:'Wat is de eerste stap bij het afvaren?',a:['Stuurwiel volledig naar bakboord en zachtjes gas vooruit, zodat de achterkant van de kade komt','Stuurwiel naar stuurboord en vol gas vooruit','Direct vol gas achteruit','Alle lijnen los en afwachten'],u:'Draai het stuurwiel volledig naar bakboord en geef zachtjes gas vooruit. De achterkant beweegt weg van de kade.',p:34},
  {q:'Waarom vaar je bij het afvaren een paar meter achteruit?',a:['Om ruimte te maken voor je punt','Om de passagiers te laten zwaaien','Om de schroef schoon te spoelen','Om de marifoon te testen'],u:'Door een paar meter achteruit te varen maak je ruimte voor je punt.',p:34},
  {q:'Waarom vaar je een brug “open”?',a:['Zodat je vroeg bent uitgelijnd en recht door de brug vaart','Zodat je sneller onder de brug door bent','Omdat de gemeente dat verplicht','Zodat de passagiers beter kunnen fotograferen'],u:'Door open te varen ben je vroeg uitgelijnd en vaar je recht door de brug. Te krap zie je niet wat er aan de andere kant gebeurt.',p:35},
  {q:'Wat betekent “bocht met vaart”?',a:['Met gedoseerde snelheid, niet met hoge snelheid','Met vol gas door de bocht','De boot eerst helemaal stilleggen','Achteruit door de bocht'],u:'Een bocht met vaart betekent met gedoseerde snelheid, niet met hoge snelheid.',p:35},
  {q:'Hoe voorkom je dat je onder een brug gaat slingeren?',a:['Een punt in de verte nemen om op af te sturen','Extra gas geven','Steeds kleine stuurbewegingen maken','Naar de brugpijlers kijken'],u:'Neem onder de brug een punt in de verte om op af te sturen. Zo voorkom je slingeren.',p:35},
  {q:'Waarom maak je bij manoeuvres weinig vaart?',a:['Dan heb je tijd om te corrigeren en is het veiliger en comfortabeler','Alleen om brandstof te besparen','Omdat de marifoon anders niet werkt','Omdat het schip anders niet kan sturen'],u:'Elke manoeuvre gaat beter als je de tijd neemt. Met weinig vaart kun je corrigeren en is het comfortabel voor de gasten.',p:35},
  {q:'Welke opdracht hoort bij de speciale verrichtingen?',a:['Vijf scheepslengtes achteruit varen','Tien rondjes om je as draaien','Met volle snelheid keren','Aanmeren met de boegschroef'],u:'Bij de speciale verrichtingen hoort onder andere: vijf scheepslengtes achteruit varen.',p:63}
 ]},
{id:'mari',t:'Marifonie',kort:'Kanalen en het marifoonbericht',p:37,
 intro:'Als schipper moet je de marifoon correct gebruiken en berichten kort, duidelijk en zakelijk houden. Goede communicatie voorkomt misverstanden en zorgt ervoor dat schepen elkaar veilig kunnen passeren of kruisen.',
 les:[
  {t:'Marifoon',p:38,b:['Voorwaarde voor de opleiding is het **basiscertificaat Marifonie**.','Alle beroepsvaartuigen moeten een marifoon hebben; op belangrijke vaarwegen zijn **twee marifoons** verplicht.','Op de Amsterdamse grachten communiceer je met andere schepen op **kanaal 10**. Op de Amstel luister je ook **kanaal 69** uit: het kanaal van de verkeersbegeleiding. Ook binnenvaartschepen communiceren hierop.','De relevante marifoonkanalen zijn **4, 69 en 10**. De bediening van de verschillende marifoons leer je aan boord (aan/uit, kanaal wisselen, volume, squelch).']},
  {t:'Het marifoonbericht',p:39,b:['Er zijn drie basismanoeuvres die je aankondigt. De opbouw van een bericht is in principe:',['1. **Naam eigen schip**','2. **Huidige locatie**','3. **Waar je heen gaat**']]},
  {t:'Een andere gracht kruisen',p:39,b:['Eigen bootnaam, de gracht waar je op vaart, het woord “kruist” en de gracht die je oversteekt.','Voorbeeld: *“Vibe op de Leliegracht kruist de Keizersgracht.”* of *“Nomag, Prinsen kruist Leidse.”*',{tip:'Komt er geen antwoord, vaar dan **rustig verder**. Een melding is **geen garantie** dat de weg vrij is: schippers missen weleens een melding, of twee schepen melden zich tegelijk. Vaar altijd stapvoets als je een andere gracht oversteekt.'}]},
  {t:'Een andere gracht in',p:40,b:['Eigen bootnaam, de gracht waar je op vaart en de gracht waar je heen gaat.','Voorbeeld: *“Vibe van de Leliegracht naar de Prinsengracht.”*','Kun je op die gracht **twee kanten** op, zeg dan ook welke richting: *“Nomag, van de Keizers naar de Leidse, richting Heren.”*']},
  {t:'Een andere gracht passeren',p:40,b:['Eigen bootnaam, de gracht waar je op vaart, het woord “passeert” en de gracht waar je langs vaart.','Voorbeeld: *“Vibe op de Leliegracht passeert de Keizersgracht.”* of *“Nomag, Heren passeert Leidse.”*']},
  {t:'Marifoonpunten op de routes',p:41,b:['Een paar vaste routes met hun marifoonpunten. Gebruik ze als voorbeeld voor je eigen casus.',{img:'route-cs',alt:'Centraal Station route met negen marifoonpunten'},{img:'route-af',alt:'Anne Frank route met acht marifoonpunten'},{img:'route-rm',alt:'Rijksmuseum route met negen marifoonpunten'}]},
  {t:'Afspraken maken',p:44,b:['Is het niet duidelijk wie eerst mag of wie waarheen gaat, dan kun je afspraken maken over de marifoon: om verduidelijking vragen, afspreken wie eerst gaat, of elkaar bijvoorbeeld ‘stuurboord stuurboord’ passeren.','Gebruik **altijd officiële termen** en houd het **kort, bondig en zakelijk**. Zo krijgt ander verkeer ook de kans om te communiceren.']}
 ],
 cbr:['Op welk marifoonkanaal wordt meestal gecommuniceerd tussen schepen op de binnenvaart in Amsterdam?','Wanneer ben je verplicht een marifoon te gebruiken tijdens het varen?','Hoe maak je een correcte marifoonoproep naar een ander schip?','Waarom is het belangrijk dat marifoonberichten kort zijn?','Mag je marifoon op 25 W staan?'],
 v:[
  {q:'Op welk kanaal communiceer je met andere schepen op de Amsterdamse grachten?',a:['Kanaal 10','Kanaal 16','Kanaal 69','Kanaal 4'],u:'Op de Amsterdamse grachten wordt met andere schepen gecommuniceerd op kanaal 10.',p:38},
  {q:'Welk kanaal luister je ook uit op de Amstel?',a:['Kanaal 69, van de verkeersbegeleiding','Kanaal 16, het noodkanaal','Kanaal 4','Geen, op de Amstel is de marifoon uit'],u:'Op de Amstel moet ook kanaal 69 worden uitgeluisterd: het kanaal van de verkeersbegeleiding.',p:38},
  {q:'Wat is de opbouw van een marifoonbericht?',a:['Naam eigen schip, huidige locatie, waar je heen gaat','Huidige locatie, tijd, naam eigen schip','Naam van het andere schip, weer, bestemming','Aantal passagiers, route, snelheid'],u:'In principe: 1. naam eigen schip, 2. huidige locatie, 3. waar je heen gaat.',p:39},
  {q:'Welk bericht is juist als je een andere gracht oversteekt?',a:['“Vibe op de Leliegracht kruist de Keizersgracht.”','“Keizersgracht, Keizersgracht, hier Vibe.”','“Vibe gaat even oversteken.”','“Kruist de Keizersgracht, Vibe, Leliegracht.”'],u:'Eigen bootnaam, gracht waar je op vaart, “kruist”, en de gracht die je oversteekt.',p:39},
  {q:'Je meldt dat je een gracht kruist, maar er komt geen antwoord. Wat doe je?',a:['Rustig en stapvoets verder; een melding is geen garantie dat de weg vrij is','Gewoon doorvaren op snelheid, je hebt je gemeld','Blijven wachten tot iemand antwoordt','Toeteren en gas geven'],u:'Zonder antwoord vaar je rustig verder, maar een melding garandeert niet dat de weg vrij is. Vaar stapvoets bij het oversteken.',p:39},
  {q:'Je vaart een gracht in waar je twee kanten op kunt. Wat voeg je toe aan je bericht?',a:['Welke richting je opgaat, bijvoorbeeld “richting Heren”','Hoeveel passagiers je hebt','Hoe snel je vaart','Hoe laat het is'],u:'Heeft de gracht twee richtingen, dan geef je ook aan welke van de twee je opgaat.',p:40},
  {q:'Welk bericht hoort bij het passeren van een gracht?',a:['“Nomag, Heren passeert Leidse.”','“Nomag, van de Heren naar de Leidse.”','“Nomag, Heren kruist Leidse.”','“Nomag, hoe is de situatie op de Leidse?”'],u:'Bij passeren noem je je bootnaam, de gracht waar je op vaart, “passeert” en de gracht waar je langs vaart.',p:40},
  {q:'Wanneer zijn twee marifoons verplicht?',a:['Op belangrijke vaarwegen','Nooit, één is altijd genoeg','Alleen ’s nachts','Alleen bij meer dan twintig passagiers'],u:'Alle beroepsvaartuigen moeten een marifoon hebben; op belangrijke vaarwegen zijn twee marifoons verplicht.',p:38},
  {q:'Waarom houd je marifoonberichten kort?',a:['Om misverstanden te voorkomen en ander verkeer ook de kans te geven','Om de batterij te sparen','Omdat lange berichten geld kosten','Omdat de marifoon anders oververhit raakt'],u:'Korte, duidelijke berichten voorkomen misverstanden en geven ander verkeer de gelegenheid om te communiceren.',p:44},
  {q:'Je maakt een afspraak met een andere boot over de marifoon. Hoe doe je dat?',a:['Met officiële termen, kort, bondig en zakelijk','Uitgebreid, zodat alles duidelijk is','In je eigen woorden en informeel','Alleen met handgebaren'],u:'Afspraken moeten duidelijk zijn: gebruik altijd officiële termen en houd het kort, bondig en zakelijk.',p:44},
  {q:'Welk certificaat is een voorwaarde voor de opleiding tot Schipper open rondvaartboot?',a:['Het basiscertificaat Marifonie','Een groot vaarbewijs','Een rijbewijs B','Een EHBO-diploma'],u:'Voorwaarde voor het volgen van de opleiding is dat het basiscertificaat Marifonie behaald is.',p:38},
  {q:'Welke marifoonkanalen noemt de opleiding als relevant?',a:['4, 69 en 10','16, 70 en 72','1, 2 en 3','10 alleen'],u:'Je moet kennis hebben van de relevante marifoonkanalen 4, 69 en 10.',p:37}
 ]},
{id:'veil',t:'Veiligheid',kort:'Veiligheidsmiddelen en man overboord',p:46,
 intro:'Als schipper ben je verantwoordelijk voor de veiligheid van je passagiers, bemanning en het schip. Je herkent risico’s, schat situaties goed in en weet hoe je handelt bij een incident. Veiligheid begint al vóórdat er iets misgaat.',
 les:[
  {t:'Veiligheidsmiddelen aan boord',p:47,b:['Er moeten altijd voldoende veiligheidsmiddelen aan boord zijn, goed bereikbaar en in goede staat. Je moet weten waar ze liggen en hoe je ze gebruikt.',['**Reddingsvesten** voor alle **passagiers** en **opblaasbare** reddingsvesten voor alle **bemanningsleden**.','**Brandblusser**: goed bereikbaar en geschikt voor een schip. Controleer of de **keuringsdatum** geldig is en de **drukmeter op groen** staat.','**EHBO-doos**: regelmatig controleren of alle materialen aanwezig zijn en niets over de datum is.','**Pikhaak**: een lange stok met een haak, om voorwerpen uit het water of vuil uit de schroef te halen (zoals een plastic zak) en bij een man-overboordsituatie iemand naar het schip te trekken.'],{tip:'Het is de verantwoordelijkheid van de schipper dat alle veiligheidsmiddelen aan boord **compleet, in goede staat en direct bereikbaar** zijn.'}]},
  {t:'Man-over-boord manoeuvre (MOB)',p:50,b:['Het doel: het slachtoffer snel terugvinden, veilig benaderen en weer aan boord krijgen, zonder extra risico door de schroef.',['1. **Sla alarm**: roep luid “Man overboord!” en zet je **schroef stil**.','2. **Wijs iemand aan** die het slachtoffer blijft volgen: “Jij, wijs naar de drenkeling.” Zo raak je de persoon niet uit het oog.','3. Gooi een **reddingsboei** naar de drenkeling en roep “Zwem”.','4. Manoeuvreer snel maar voorzichtig terug **naar de persoon**. Zijn er andere schepen in de buurt, meld dan via de **marifoon** dat er iemand overboord is.','5. Trek de persoon naar het schip met de **pikhaak** en help hem **aan boord** via een trap, de rand of met hulp van de bemanning.','6. **Controleer direct de toestand**: bewustzijn en ademhaling, verleen eerste hulp indien nodig (bijvoorbeeld met isolatiedeken) en bel **112** als medische hulp nodig is.']]},
  {t:'In- en uitstappen',p:51,b:['Veel incidenten gebeuren bij het in- en uitstappen.',['**De schipper**: stap je zelf van of aan boord om lijnen vast te maken, dan draag je **altijd een draagbaar (opblaasbaar) reddingsvest**.','**Passagiers**: het schip ligt stabiel en goed vast (**minimaal 2 lijnen**) voordat passagiers aan of van boord gaan. De afstand tussen wal en schip is zo klein mogelijk.']]}
 ],
 cbr:['Wat doe je als iemand overboord valt?','Wat doe je als je merkt dat iemand uit het water niet meer ademt?','Wat zijn de eerste stappen bij brand aan boord?','Wat doe je als je een rotte-eierenlucht ruikt aan boord?','Waarom is een schoon schip belangrijk voor de veiligheid?','Welke veiligheidsmiddelen moeten er minimaal aan boord zijn?','Waar let je op bij het instappen van passagiers?','Waarom is het belangrijk om passagiers vooraf instructies te geven?'],
 v:[
  {q:'Iemand valt overboord. Wat is je eerste stap?',a:['Alarm slaan (“Man overboord!”) en de schroef stilzetten','Direct achteruit varen naar de persoon','Eerst 112 bellen','Zelf het water in springen'],u:'Sla direct alarm door luid “Man overboord!” te roepen, en zet je schroef stil.',p:50},
  {q:'Waarom wijs je iemand aan die naar de drenkeling blijft wijzen?',a:['Zodat je de persoon in het water niet uit het oog verliest','Zodat die persoon het water in kan springen','Om de andere passagiers bezig te houden','Omdat dat in het CVO staat'],u:'Door iemand te laten blijven wijzen, raak je de drenkeling niet uit het oog.',p:50},
  {q:'Wat gooi je naar de drenkeling?',a:['Een reddingsboei, en je roept “Zwem”','De pikhaak','Een landvast','Een reddingsvest van de bemanning'],u:'Gooi een reddingsboei naar de drenkeling en roep “Zwem”.',p:50},
  {q:'Wanneer meld je een man overboord via de marifoon?',a:['Als er andere schepen in de buurt zijn','Nooit, dat leidt af','Pas als de persoon weer aan boord is','Alleen op zee'],u:'Zijn er andere schepen in de buurt, geef dan via de marifoon aan dat er iemand overboord is.',p:50},
  {q:'Waarvoor gebruik je de pikhaak bij een man overboord?',a:['Om de persoon dichter naar het schip te trekken','Om de schroef los te maken','Om de boei op te halen voordat je hem gooit','Om de afstand tot de kade te meten'],u:'Met de pikhaak trek je de persoon dichter naar het schip en help je hem aan boord.',p:50},
  {q:'De persoon is weer aan boord. Wat doe je direct?',a:['Bewustzijn en ademhaling controleren, eerste hulp geven en zo nodig 112 bellen','Verder varen met de rondvaart','Alleen droge kleren geven','Het incident in het logboek zetten en verder niets'],u:'Controleer direct bewustzijn en ademhaling, verleen eerste hulp indien nodig en bel 112 als medische hulp nodig is.',p:50},
  {q:'Waarom zet je bij een man overboord de schroef stil?',a:['Om geen extra risico te veroorzaken voor de persoon in het water','Om brandstof te besparen','Om de marifoon beter te horen','Omdat de motor anders oververhit raakt'],u:'Het doel is het slachtoffer veilig terug aan boord te krijgen zonder extra risico door de schroef.',p:50},
  {q:'Wat controleer je aan de brandblusser?',a:['Of hij bereikbaar is, de keuringsdatum geldig is en de drukmeter op groen staat','Alleen de kleur','Of hij zwaar genoeg is','Of hij in de motorruimte ligt'],u:'De brandblusser moet goed bereikbaar zijn, gekeurd (geldige keuringsdatum) en de drukmeter moet op groen staan.',p:47},
  {q:'Welke reddingsvesten zijn er voor de bemanning?',a:['Opblaasbare reddingsvesten','Dezelfde als voor passagiers, onder de banken','Geen, de bemanning kan zwemmen','Alleen een reddingsboei'],u:'Er moeten reddingsvesten zijn voor alle passagiers en opblaasbare reddingsvesten voor alle bemanningsleden.',p:47},
  {q:'Waar let je op bij de EHBO-doos?',a:['Dat alle benodigde materialen aanwezig zijn en niets over de datum is','Dat hij goed verstopt ligt','Dat hij op slot zit','Dat hij in de motorruimte staat'],u:'Controleer regelmatig of alle materialen aanwezig zijn en of producten niet over de datum zijn.',p:48},
  {q:'Wanneer mogen passagiers aan of van boord gaan?',a:['Als het schip stabiel ligt en vastligt met minimaal 2 lijnen','Zodra het schip de kade raakt','Als er één lijn vastzit','Wanneer de passagiers dat willen'],u:'Het schip moet stabiel liggen en goed vastgemaakt zijn (minimaal 2 lijnen), met zo weinig mogelijk afstand tussen wal en schip.',p:51},
  {q:'Je stapt zelf van boord om de lijnen vast te maken. Wat draag je?',a:['Altijd een draagbaar (opblaasbaar) reddingsvest','Niets bijzonders','Werkhandschoenen, geen vest nodig','Alleen een pet met klep'],u:'Als de schipper van of aan boord stapt om lijnen vast te maken, draagt hij altijd een draagbaar reddingsvest.',p:51},
  {q:'Wie is verantwoordelijk dat alle veiligheidsmiddelen compleet en bereikbaar zijn?',a:['De schipper','De passagiers','De gemeente','De keurder van het CVO'],u:'Het is de verantwoordelijkheid van de schipper dat alle veiligheidsmiddelen compleet, in goede staat en direct bereikbaar zijn.',p:48}
 ]},
{id:'tech',t:'Scheepstechniek',kort:'Motor, koeling, hydrauliek en bilge',p:53,
 intro:'Je hoeft geen monteur te zijn, maar je moet wel begrijpen hoe het schip werkt en wat je controleert om veilig te varen: de motor, de aandrijving, de stuurinrichting en andere systemen aan boord.',
 les:[
  {t:'Motor en basiscontrole',p:54,b:['De motor is het hart van het schip. Voor vertrek controleer je onder andere:',['Oliepeil','Koelvloeistof','Brandstofniveau','Eventuele lekkages','Slangen en verbindingen'],'Let ook op afwijkingen zoals vreemde geluiden of geuren, en rookontwikkeling of brandlucht.',{tip:'Bij twijfel: **stop** en onderzoek het probleem voordat je verder vaart.'}]},
  {t:'Koeling van de motor',p:54,b:['De motor moet gekoeld worden om oververhitting te voorkomen, meestal met **waterkoeling**. Je moet weten hoe de koeling werkt, waar je kunt zien of er koelwater uitstroomt, en dat een gebrek aan koeling kan leiden tot **motorschade**.']},
  {t:'Schroef en aandrijving',p:55,b:['De schroef zorgt voor de voortstuwing; de aandrijving brengt de kracht van de motor over naar de schroef.',['De schroef kan links- of rechtsdraaiend zijn','De draairichting beïnvloedt je manoeuvres','Vuil of lijnen in de schroef verminderen de werking'],'Je moet weten hoe jouw schip reageert bij vooruit en achteruit slaan.']},
  {t:'Hydrauliek en besturing',p:55,b:['Veel schepen gebruiken hydrauliek voor de besturing. Je moet weten hoe de besturing reageert, dat er voldoende hydrauliekolie is, en dat **lekkages kunnen leiden tot uitval van de besturing**.','Bij problemen met de besturing handel je direct en breng je het schip **veilig tot stilstand**.']},
  {t:'Accu’s en elektriciteit',p:55,b:['Accu’s zijn er voor het starten van de motor en het voeden van de elektrische systemen.',['Accu’s moeten goed geladen zijn','Slechte accu’s kunnen problemen geven bij het starten','Bij accu’s kan **knalgas** ontstaan'],{tip:'Een **rotte-eierenlucht** kan wijzen op een probleem met de accu. Ventileer en wees voorzichtig met vonken of vuur.'}]},
  {t:'Bilge en water in het schip',p:56,b:['De bilge is het **laagste punt** van het schip, waar water zich kan verzamelen. Je controleert of er water in de bilge staat, of de motor droog staat en of de bilgepomp werkt.','Te veel water in het schip kan gevaarlijk zijn en moet **direct** worden aangepakt.']}
 ],
 cbr:['Wat controleer je in de motorruimte voordat je gaat varen?','Wat doe je als er geen koelwater uit de uitlaat komt?','Wat is schroefwerking en hoe merk je dat tijdens het varen?','Hoe kun je zien of je een links- of rechtsdraaiende schroef hebt?','Wat gebeurt er met je schip als er vuil in de schroef zit?','Waar let je op bij het controleren van de hydrauliek?','Wat betekent een rotte-eierenlucht in de motorruimte?','Wat doe je als je merkt dat je besturing niet goed reageert?'],
 v:[
  {q:'Wat controleer je voor vertrek aan de motor?',a:['Oliepeil, koelvloeistof, brandstofniveau, lekkages, slangen en verbindingen','Alleen of hij start','De kleur van de motorkap','De bouwdatum van de motor'],u:'Voor vertrek controleer je onder andere oliepeil, koelvloeistof, brandstofniveau, lekkages en slangen en verbindingen.',p:54},
  {q:'Je hoort een vreemd geluid en ruikt brandlucht. Wat doe je?',a:['Stoppen en het probleem onderzoeken voordat je verder vaart','Doorvaren tot het einde van de rondvaart','Meer gas geven','Het raam openzetten en doorvaren'],u:'Bij twijfel stop je en onderzoek je het probleem voordat je verder vaart.',p:54},
  {q:'Hoe wordt de motor meestal gekoeld?',a:['Met waterkoeling','Met luchtkoeling','Met ijsblokjes','Hij hoeft niet gekoeld te worden'],u:'De motor wordt meestal gekoeld met waterkoeling.',p:54},
  {q:'Wat kan een gebrek aan koeling veroorzaken?',a:['Motorschade door oververhitting','Een lege accu','Een lekke band','Minder brandstofverbruik'],u:'De motor moet gekoeld worden om oververhitting te voorkomen; een gebrek aan koeling kan leiden tot motorschade.',p:54},
  {q:'Er komt geen koelwater uit de uitlaat. Wat doe je?',a:['Stoppen en onderzoeken: zonder koeling kan de motor beschadigen','Harder varen zodat er meer water wordt aangezogen','Niets, dat is normaal','Alleen de marifoon aanzetten'],u:'Je moet weten waar je kunt zien of er koelwater uitstroomt. Een gebrek aan koeling kan motorschade geven; bij twijfel stop en onderzoek je.',p:54},
  {q:'Wat doet de aandrijving?',a:['Brengt de kracht van de motor over naar de schroef','Zorgt voor de verlichting','Koelt de motor','Stuurt het schip naar links of rechts'],u:'De aandrijving brengt de kracht van de motor over naar de schroef.',p:55},
  {q:'Wat gebeurt er als er vuil of een lijn in de schroef zit?',a:['De werking van de schroef vermindert','Het schip vaart sneller','Er verandert niets','De motor slaat automatisch af'],u:'Vuil of lijnen in de schroef verminderen de werking.',p:55},
  {q:'Waarom is een lekkage in de hydrauliek gevaarlijk?',a:['Het kan leiden tot uitval van de besturing','De motor gaat dan roken','De marifoon valt uit','De bilgepomp stopt'],u:'Veel schepen sturen hydraulisch. Lekkages kunnen leiden tot uitval van de besturing.',p:55},
  {q:'Je besturing reageert niet goed. Wat doe je?',a:['Direct handelen en het schip veilig tot stilstand brengen','Doorvaren en na de rit melden','Harder gas geven','Alleen de boegschroef gebruiken en doorvaren'],u:'Bij problemen met de besturing handel je direct en breng je het schip veilig tot stilstand.',p:55},
  {q:'Je ruikt een rotte-eierenlucht aan boord. Waar kan dat op wijzen?',a:['Een probleem met de accu (knalgas): ventileren en voorzichtig met vonken of vuur','Een vol toilet, verder niets aan de hand','Te veel koelwater','Een lege brandstoftank'],u:'Een rotte-eierenlucht kan wijzen op een accuprobleem; bij accu’s kan knalgas ontstaan. Ventileer en wees voorzichtig met vonken of vuur.',p:55},
  {q:'Wat is de bilge?',a:['Het laagste punt van het schip waar water zich verzamelt','De achterkant van het schip','Het dak van het stuurhuis','De brandstoftank'],u:'De bilge is het laagste punt van het schip waar water zich kan verzamelen.',p:56},
  {q:'Er staat te veel water in het schip. Wat doe je?',a:['Direct aanpakken, want het kan gevaarlijk zijn','Na de vaart bekijken','Wachten tot het vanzelf wegloopt','Negeren als de motor nog loopt'],u:'Te veel water in het schip kan gevaarlijk zijn en moet direct worden aangepakt.',p:56},
  {q:'Waarvoor zijn de accu’s aan boord?',a:['Voor het starten van de motor en het voeden van de elektrische systemen','Alleen voor de muziek','Voor de koeling van de motor','Voor de hydrauliek van het roer'],u:'Accu’s zijn aan boord voor het starten van de motor en het voeden van elektrische systemen.',p:55}
 ]},
{id:'soc',t:'Sociale vaardigheden',kort:'Instructie, gastheerschap en sociale hygiëne',p:57,
 intro:'Als schipper ben je niet alleen verantwoordelijk voor het varen, maar ook voor de ervaring aan boord. Je bent het aanspreekpunt voor passagiers en zorgt voor een veilige, prettige en professionele sfeer.',
 les:[
  {t:'Passagiersinstructie',p:58,b:['Voordat je vertrekt geef je duidelijke basisinstructies. Zo voorkom je onrust en gevaarlijke situaties. Dit moet er **altijd** in zitten:',['Stel jezelf (en eventuele andere bemanning) voor en maak duidelijk dat jij de **eindverantwoordelijke** bent aan boord','Beschrijf de **vaart** die je gaat doen','Houd tijdens het varen **alles binnenboord**: geen handen, armen of andere lichaamsdelen buiten het schip','Let op bij lage **bruggen**: blijf zo veel mogelijk zitten en wees je bewust van je omgeving','**Reddingsvesten** liggen onder de banken','De **nooduitgangen** zijn op [locatie aan boord]','Volg altijd de **instructies** van de schipper en bemanning op'],'Verdere instructies hangen af van de vaart, de rederij en het type tour.']},
  {t:'Gastheerschap en gastvrouwschap',p:59,b:['Je bent **vriendelijk, attent en behulpzaam** richting passagiers en zorgt dat gasten zich welkom voelen. Je houdt rekening met verschillende gasten, zoals toeristen, gezinnen of groepen.','Je speelt in op wensen van passagiers waar dat kan, **zonder dat het ten koste gaat van de veiligheid**. Je begrijpt en beantwoordt eenvoudige vragen en opmerkingen.']},
  {t:'Presentatietechnieken',p:59,b:['Je brengt informatie over met een **welkomstpraatje** en een **gidsenpraatje**. Bij aanvang heet je passagiers welkom en deel je eventueel praktische informatie; tijdens de vaart vertel je over de omgeving en bezienswaardigheden.','Dit moet je kunnen in het **Nederlands en Engels**.']},
  {t:'Sociale hygiëne',p:60,b:['Je bent verantwoordelijk voor een **sociaal veilige omgeving** aan boord. Je houdt toezicht op het gedrag van passagiers en grijpt in wanneer dat nodig is, bijvoorbeeld bij overmatig alcoholgebruik, ongewenst gedrag of spanningen tussen passagiers.','Je past de regels van sociale hygiëne toe door:',['duidelijk grenzen te stellen','respectvol te communiceren','escalaties te voorkomen'],'Het doel: iedereen aan boord voelt zich veilig en de vaart verloopt zonder problemen.']}
 ],
 cbr:['Hoe zorg jij ervoor dat passagiers zich welkom voelen aan boord?','Wat doe je als een passagier zich onveilig gedraagt?','Hoe spreek je een passagier aan op ongewenst gedrag?','Wat vertel je in een welkomstpraatje aan het begin van de vaart?','Waarom is het belangrijk om in meerdere talen te kunnen communiceren?','Wat betekent sociale hygiëne aan boord van een schip?','Wat doe je als er spanning ontstaat tussen passagiers?'],
 v:[
  {q:'Welk punt hoort ALTIJD in de passagiersinstructie?',a:['Houd alles binnenboord: geen handen of armen buiten het schip','De geschiedenis van de rederij','Het menu aan boord','De bouwjaren van de grachtenpanden'],u:'Vast onderdeel van de instructie: houd tijdens het varen alles binnenboord.',p:58},
  {q:'Waar liggen de reddingsvesten volgens de standaardinstructie?',a:['Onder de banken','In het stuurhuis achter slot','In de motorruimte','Op de kade'],u:'In de instructie vertel je dat de reddingsvesten onder de banken liggen.',p:58},
  {q:'Wat zeg je in de instructie over lage bruggen?',a:['Blijf zo veel mogelijk zitten en wees je bewust van je omgeving','Ga staan om de brug te bekijken','Houd je hand omhoog tegen de brug','Lage bruggen komen niet voor'],u:'Let op bij lage bruggen: blijf zo veel mogelijk zitten en wees je bewust van je omgeving.',p:58},
  {q:'Wie maak je in de instructie duidelijk als eindverantwoordelijke aan boord?',a:['Jezelf, de schipper','De gids','De oudste passagier','De rederij'],u:'Stel jezelf voor en maak duidelijk dat jij de eindverantwoordelijke bent aan boord.',p:58},
  {q:'Waarom geef je vooraf een passagiersinstructie?',a:['Om onrust en gevaarlijke situaties tijdens het varen te voorkomen','Omdat de rederij dat leuk vindt','Om tijd te vullen','Om fooi te krijgen'],u:'Door vooraf heldere afspraken te maken voorkom je onrust en gevaarlijke situaties.',p:58},
  {q:'In welke talen moet je je welkomst- en gidsenpraatje kunnen doen?',a:['Nederlands en Engels','Alleen Nederlands','Alleen Engels','Nederlands, Duits en Frans'],u:'Je moet het welkomstpraatje en gidsenpraatje in het Nederlands en Engels kunnen doen.',p:59},

/* LEER_LIVE=false: leeromgeving alleen zichtbaar voor medewerkers (voorbeeldweergave); kandidaten gaan direct naar hun casus */

/* ---------- leeromgeving (theorie + quiz) ---------- */
const LV={v:'home',id:null};let LQ=null;
const thEmpty=()=>({data:{h:{},eind:null},xp:0,hoofdstukken:0,geslaagd_op:null});
const fmtT=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isPreview=()=>APP.role==='leer-voorbeeld';
const chRes=id=>(APP.th&&APP.th.data&&APP.th.data.h&&APP.th.data.h[id])||null;
const pctOf=r=>r&&r.van?r.best/r.van:0;
const chPassed=id=>pctOf(chRes(id))>=LEER_PASS;
const starsOf=r=>{const p=pctOf(r);return p>=1?3:p>=0.9?2:p>=LEER_PASS?1:0};
const chUnlocked=i=>isPreview()||i===0||chPassed(LEER[i-1].id);
const allPassed=()=>LEER.every(c=>chPassed(c.id));

const casusOpenFor=(th,lid)=>!!((th&&th.geslaagd_op)||(lid&&lid.casus_vrij));

function thXP(d){let x=0;LEER.forEach(c=>{const r=d.h&&d.h[c.id];if(r)x+=Math.round(pctOf(r)*100)});const e=d.eind;if(e){x+=Math.round(pctOf(e)*200);if(pctOf(e)>=EIND.pass)x+=50}return x}
function rankOf(xp){let i=0;RANKS.forEach((r,k)=>{if(xp>=r[0])i=k});const cur=RANKS[i],nxt=RANKS[i+1];return{naam:cur[1],i,next:nxt?nxt[1]:null,need:nxt?nxt[0]-xp:0,pct:nxt?Math.round((xp-cur[0])/(nxt[0]-cur[0])*100):100}}
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z"/></svg>';
const starRow=(n,big)=>'<span class="stars'+(big?' big':'')+'" role="img" aria-label="'+n+' van 3 sterren">'+[0,1,2].map(i=>'<i class="'+(i<n?'on':'')+'">'+STAR+'</i>').join('')+'</span>';

let thBusy=false,thAgain=false;

    const meta=pass?starRow(starsOf(r))+'<span class="lmeta">Beste score '+Math.round(pctOf(r)*100)+'%</span>':r?'<span class="lmeta">Beste score '+Math.round(pctOf(r)*100)+'% · nog niet gehaald</span>':un?'<span class="lmeta">'+(r&&r.gelezen?'Les gelezen':'Nog niet begonnen')+'</span>':'<span class="lmeta">Haal eerst hoofdstuk '+i+'</span>';

    '<li class="lnode casus '+(open?'done':'lock')+'"><span class="dot" aria-hidden="true">⚓</span><div class="lcard"><div class="lcard-t"><small>Praktijktoets 3</small><b>Je casus</b><span>'+(open?(theoryDone()?'Theorie gehaald. Je kunt aan je casus beginnen.':'Je opleider heeft je casus vrijgegeven.'):'Gaat open zodra je de eindtoets hebt gehaald.')+'</span></div>'+(open&&!isPreview()?'<div class="lcard-a"><button type="button" class="btn sm primary" data-lact="casus">Naar je casus</button></div>':'')+'</div></li></ol>';

  return h}

function viewLes(){const i=LEER.findIndex(c=>c.id===LV.id),c=LEER[i];if(!c)return viewHome();
  let h='<div class="lbar"><button type="button" class="btn soft sm" data-lact="home">← Overzicht</button><span class="lcrumb">Hoofdstuk '+(i+1)+' van '+LEER.length+'</span></div>';

const qOf=(c,v,k)=>Object.assign({ch:c.id,k},v);
function mkQ(v,order){order=order||(v.vast?[0,1,2,3]:shuffle([0,1,2,3]));return{q:v.q,opts:order.map(k=>v.a[k]),goed:order.indexOf(v.vast?v.goed:0),u:v.u,p:v.p,ch:v.ch,k:v.k,o:order}}
const uniqQ=list=>{const seen=new Set();return list.filter(v=>{if(seen.has(v.q))return false;seen.add(v.q);return true})};
function startQuiz(id){let pool,title;
  if(id==='eind'){const per=LEER.map(c=>shuffle(c.v.map((v,k)=>qOf(c,v,k))));let pick=[];per.forEach(p=>pick.push(...p.splice(0,2)));pick=uniqQ(pick.concat(shuffle(per.flat()))).slice(0,EIND.n);pool=shuffle(pick);title=EIND.t}
  else{const c=LEER.find(x=>x.id===id);if(!c)return;pool=uniqQ(shuffle(c.v.map((v,k)=>qOf(c,v,k)))).slice(0,LEER_N);title=c.t}
  LQ={id,title,qs:pool.map(v=>mkQ(v)),i:0,score:0,combo:0,best:0,ans:null,fout:[]};LV.v='quiz';saveBezig();renderLeer();leerScroll();setTimeout(()=>{const b=$('#leer .qopt');if(b)b.focus()},30)}
function saveBezig(){if(!LQ||!APP.th)return;APP.th.data.bezig={id:LQ.id,qs:LQ.qs.map(q=>[q.ch,q.k,q.o]),i:LQ.i,ans:LQ.ans,score:LQ.score,combo:LQ.combo,best:LQ.best,fout:LQ.fout,op:nowIso()};thSave()}
function bezigInfo(){const b=APP.th&&APP.th.data&&APP.th.data.bezig;if(!b||!b.qs||!b.qs.length)return null;const c=LEER.find(x=>x.id===b.id);if(b.id!=='eind'&&!c)return null;return{b,naam:b.id==='eind'?'Eindtoets':'Hoofdstuk '+(LEER.indexOf(c)+1)+' · '+c.t,nr:Math.min(b.qs.length,(b.i||0)+(b.ans!=null?1:0)),n:b.qs.length}}
function resumeQuiz(){const b=APP.th&&APP.th.data&&APP.th.data.bezig;if(!b)return;try{const qs=b.qs.map(([ch,k,o])=>{const c=LEER.find(x=>x.id===ch);const v=c&&c.v[k];if(!v)throw 0;return mkQ(qOf(c,v,k),o)});const c=LEER.find(x=>x.id===b.id);
  LQ={id:b.id,title:b.id==='eind'?EIND.t:c.t,qs,i:Math.min(b.i||0,qs.length-1),score:b.score||0,combo:b.combo||0,best:b.best||0,ans:b.ans==null?null:b.ans,fout:b.fout||[]};LV.v='quiz';renderLeer();leerScroll()}
  catch(e){delete APP.th.data.bezig;thSave();toast('Deze quiz kon niet worden hervat. Begin opnieuw.',true);renderLeer()}}
function viewQuiz(){const q=LQ.qs[LQ.i],n=LQ.qs.length,a=LQ.ans;const chI=LEER.findIndex(c=>c.id===q.ch);
  let h='<div class="lbar"><button type="button" class="btn soft sm" data-lact="stop">Stoppen</button><span class="lcrumb">'+esc(LQ.id==='eind'?'Eindtoets':'Hoofdstuk '+(chI+1)+' · '+LQ.title)+'</span><span class="combo'+(LQ.combo>=3?' hot':'')+'" aria-live="polite">'+(LQ.combo>=2?LQ.combo+' goed op rij':'')+'</span></div>';
  h+='<div class="qprog"><div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+(LQ.i+(a!=null?1:0))+'" aria-label="Voortgang quiz"><span style="width:'+Math.round((LQ.i+(a!=null?1:0))/n*100)+'%"></span></div><span>Vraag '+(LQ.i+1)+' van '+n+'</span></div>';
  h+='<section class="qcard"><h2 id="qText">'+esc(q.q)+'</h2><div class="qopts" role="group" aria-labelledby="qText">'+q.opts.map((o,k)=>{let cls='qopt';if(a!=null){if(k===q.goed)cls+=' good';else if(k===a)cls+=' bad';else cls+=' dim'}return'<button type="button" class="'+cls+'" data-q="'+k+'"'+(a!=null?' disabled':'')+'><span class="ql" aria-hidden="true">'+'ABCD'[k]+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div>';
  if(a!=null){const good=a===q.goed;h+='<div class="qfb '+(good?'good':'bad')+'" role="status"><b>'+(good?(LQ.combo>=3?'Goed! '+LQ.combo+' op rij.':'Goed!'):'Helaas, dat is niet goed.')+'</b><p>'+esc(q.u)+'</p><small>Theorieboek p. '+q.p+'</small></div><div class="qnext"><button type="button" class="btn primary" data-lact="next" id="qNext">'+(LQ.i+1<n?'Volgende vraag':'Bekijk je resultaat')+'</button></div>'}
  h+='</section><p class="note small">Tip: je kunt ook antwoorden met de toetsen A, B, C, D en doorgaan met Enter.</p>';return h}
function answer(k){if(!LQ||LQ.ans!=null)return;const q=LQ.qs[LQ.i];LQ.ans=k;if(k===q.goed){LQ.score++;LQ.combo++;LQ.best=Math.max(LQ.best,LQ.combo)}else{LQ.combo=0;LQ.fout.push({q:q.q,goed:q.opts[q.goed],jij:q.opts[k],p:q.p})}saveBezig();renderLeer();setTimeout(()=>{const b=$('#qNext');if(b)b.focus()},30)}
async function nextQ(){if(!LQ||LQ.ans==null)return;if(LQ.i+1<LQ.qs.length){LQ.i++;LQ.ans=null;renderLeer();setTimeout(()=>{const b=$('#leer .qopt');if(b)b.focus()},30);return}await finishQuiz()}

  h1('6. Bezienswaardigheden');t.bez.forEach((b,n)=>{h2('B'+(n+1)+'. '+(b.titel||'Bezienswaardigheid'));if((b.nl||'').trim())para(b.nl);if((b.en||'').trim())para(b.en,{color:MUT,style:'italic'})});if(!t.bez.length)para('Nog niet beschreven.',{color:MUT});
  h1('7. Slotwoord');h2('Nederlands');para(fillName(t.slotNL)||'-');if((t.slotEN||'').trim()){h2('English');para(fillName(t.slotEN))}
  const v=state.veiligheid;newPage();h1('8. Reddingsmiddelen aan boord');
  kv('Reddingsvesten',(v.vesten!=null?v.vesten+' stuks':'-')+(v.vestenLoc?'. '+v.vestenLoc:''));kv('Bemanning',(v.crew!=null?v.crew+' vesten':'-')+(v.crewType?'. '+v.crewType:''));kv('Reddingsboeien',v.boeien!=null?v.boeien+' stuks':'-');kv('Pikhaak',v.pikhaak?'Aanwezig':'Niet aanwezig');kv('EHBO-kit',v.ehboLoc);if(v.overig)kv('Overig',v.overig);y+=2;for(const f of (v.fotos||[])){const src=await photoSrc(f);if(src)img(src,f.w,f.h,80,62)}
  h1('9. Pictogram verbanddoos');ensure(26);doc.setFillColor(22,155,85);doc.roundedRect(M,y,20,20,1.5,1.5,'F');doc.setFillColor(255,255,255);doc.rect(M+8,y+4,4,12,'F');doc.rect(M+4,y+8,12,4,'F');font(10.5,'normal',INK);doc.text('Wit kruis op een groen vlak (ISO 7010, E003).',M+25,y+8);if(v.ehboLoc)doc.text(clean('Aan boord: '+v.ehboLoc),M+25,y+14);y+=26;
  h1('10. Brandblusser in de passagiersruimte');kv('Type',BLUS_NAMES[v.blusType]||'-');kv('Plaats',v.blusLoc);
  h1('11. Blussende werking');para((v.werking||[]).length?(v.werking.map(x=>WERK_NAMES[x]).join(', ')+'.'):'-');if(v.werkingToel)para(v.werkingToel,{color:MUT});
  const mi=state.milieu;h1('12. Energiebesparende maatregelen');para(mi.maatregelen||'-');
  h1('13. Gelden deze maatregelen ook bij elektrisch varen?');para((mi.elektrisch?(mi.elektrisch==='ja'?'Ja. ':'Nee. '):'')+(mi.elektrischToel||''));
  h1('14. Wat wordt bedoeld met 0% uitstoot?');para(mi.nul||'-');
  h1('15. Ontwikkelingen in milieuvriendelijke aandrijvingen');para(mi.ontw||'-');
  y+=4;para('Let op: het kan zijn dat er tijdens de praktijktoets wordt afgeweken van dit voorstel voor de vaarroute.',{size:9.5,color:MUT,style:'italic'});
  const n=doc.getNumberOfPages();for(let i=2;i<=n;i++){doc.setPage(i);if(LOGO.s)doc.addImage(LOGO.s,'PNG',W-M-7,4,7,7);font(8.5,'normal',MUT);doc.text('Casus praktijktoets 3 SOR',W/2,9.5,{align:'center'});doc.text(clean(k.naam||''),M,9.5);doc.text(String(i),W/2,H-8,{align:'center'});doc.setDrawColor(...LINE);doc.setLineWidth(0.25);doc.line(M,12.5,W-M,12.5)}
  return doc.output('blob')}
let pdfBusy=false;
async function downloadPdf(){if(pdfBusy)return;pdfBusy=true;const btn=$('#btnPdf');if(btn){btn.disabled=true;btn.textContent='PDF maken…'}try{const blob=await buildPdf();await saveFile('Casus SOR - '+safeName(state.kandidaat.naam)+'.pdf',blob)}catch(e){console.error(e);toast(e&&e.message==='lib'?'De PDF-bibliotheek is niet geladen. Controleer je internetverbinding en herlaad de pagina.':'Het maken van de PDF is mislukt.',true)}finally{pdfBusy=false;if(btn){btn.disabled=false;btn.textContent='PDF downloaden'}}}

/* ---------- theme & init ---------- */
const mq=window.matchMedia('(prefers-color-scheme: dark)');const retheme=()=>{styleMap();if(APP.mode==='edit')drawAll()};
if(mq.addEventListener)mq.addEventListener('change',retheme);
new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('resize',()=>map.invalidateSize());
window.addEventListener('beforeunload',()=>{if(APP.dirty.size)flush()});
/* item in de lijst aanklikken -> uitlichten op de kaart */
var SEL=null;let spotLayer=null,spotT=null;
function spotlight(pos,label,zoom){if(!pos)return;const ll=toLL(pos);const inView=map.getBounds().pad(-0.12).contains(ll);if(zoom||!inView)map.flyTo(ll,Math.max(map.getZoom(),17),{duration:0.55});
  if(spotLayer)map.removeLayer(spotLayer);clearTimeout(spotT);spotLayer=L.marker(ll,{interactive:false,keyboard:false,zIndexOffset:2000,icon:L.divIcon({className:'',html:'<span class="spot"></span>',iconSize:[64,64],iconAnchor:[32,32]})}).addTo(map);
  if(label)spotLayer.bindTooltip(label,{permanent:true,direction:'top',offset:[0,-30],className:'spot-tip'}).openTooltip();
  spotT=setTimeout(()=>{if(spotLayer){map.removeLayer(spotLayer);spotLayer=null}},3200)}
function spotFor(el){if(el.dataset.aid){const a=state.aandacht.find(x=>x.id===el.dataset.aid);return a&&a.pos?[a.pos,a.titel||(a.cat&&a.cat.length?catName(a.cat[0]):'Aandachtspunt')]:null}
  if(el.dataset.mid){const m=state.meldpunten.find(x=>x.id===el.dataset.mid);return m&&m.pos?[m.pos,m.melding||'Meldpunt']:null}
  if(el.dataset.sid){const b=state.borden.find(x=>x.id===el.dataset.sid);return b&&b.pos?[b.pos,b.locatie||'Bord']:null}
  if(el.dataset.man){const x=state.manoeuvres[el.dataset.man];const M=MANS.find(q=>q.k===el.dataset.man);return x&&x.pos?[x.pos,M?M.t:'Manoeuvre']:null}
  if(el.dataset.brow){const f=R&&R.bridges.find(q=>q.br.key===el.dataset.brow);return f?[[f.br.x,f.br.y],bridgeLabel(f.br)]:null}
  return null}
/* het aangeklikte item ook in de lijst oranje markeren */
function selOf(el){for(const k of ['aid','mid','sid','man','brow']){if(el.dataset[k]!=null){const a='data-'+(k==='brow'?'brow':k);return'['+a+'="'+el.dataset[k]+'"]'}}return null}
function applySel(){$$('.sel',panel).forEach(x=>x.classList.remove('sel'));if(!SEL)return;const el=panel.querySelector(SEL);if(el)el.classList.add('sel')}
function selectEl(el){SEL=selOf(el);applySel()}
const _renderPanel=renderPanel;renderPanel=function(){_renderPanel();applySel()};
panel.addEventListener('click',e=>{if(e.target.closest('button,select,a,.btn,[data-act$="-del"]'))return;const c=e.target.closest('[data-aid],[data-mid],[data-sid],[data-man],[data-brow]');if(!c)return;selectEl(c);const sp=spotFor(c);if(sp)spotlight(sp[0],sp[1],false)});
panel.addEventListener('click',e=>{const b=e.target.closest('[data-act$="-zoom"]');if(!b)return;e.stopImmediatePropagation();const c=b.closest('[data-aid],[data-mid],[data-sid],[data-man]');if(c)selectEl(c);const sp=c&&spotFor(c);if(sp)spotlight(sp[0],sp[1],true)},true);
styleMap();zoomClasses();
initPlatform();
window.__casus={buildPdf,state:()=>state,route:()=>R,checks:()=>CHECKS,app:APP};
})();
