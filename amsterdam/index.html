const qOf=(c,v,k)=>Object.assign({ch:c.id,k},v);
function mkQ(v,order){order=order||(v.vast?[0,1,2,3]:shuffle([0,1,2,3]));return{q:v.q,opts:order.map(k=>v.a[k]),goed:order.indexOf(v.vast?v.goed:0),u:v.u,p:v.p,ch:v.ch,k:v.k,o:order}}
const uniqQ=list=>{const seen=new Set();return list.filter(v=>{if(seen.has(v.q))return false;seen.add(v.q);return true})};
function startQuiz(id){let pool,title;
  if(id==='eind'){const per=LEER.map(c=>shuffle(c.v.map((v,k)=>qOf(c,v,k))));let pick=[];per.forEach(p=>pick.push(...p.splice(0,2)));pick=uniqQ(pick.concat(shuffle(per.flat()))).slice(0,EIND.n);pool=shuffle(pick);title=EIND.t}
  else{const c=LEER.find(x=>x.id===id);if(!c)return;pool=uniqQ(shuffle(c.v.map((v,k)=>qOf(c,v,k)))).slice(0,LEER_N);title=c.t}
  LQ={id,title,qs:pool.map(v=>mkQ(v)),i:0,score:0,combo:0,best:0,ans:null,fout:[]};LV.v='quiz';saveBezig();renderLeer();leerScroll();setTimeout(()=>{const b=$('#leer .qopt');if(b)b.focus()},30)}
function saveBezig(){if(!LQ||!APP.th)return;APP.th.data.bezig={id:LQ.id,qs:LQ.qs.map(q=>[q.ch,q.k,q.o]),i:LQ.i,ans:LQ.ans,score:LQ.score,combo:LQ.combo,best:LQ.best,fout:LQ.fout,op:nowIso()};thSave()}
function bezigInfo(){const b=APP.th&&APP.th.data&&APP.th.data.bezig;if(!b||!b.qs||!b.qs.length)return null;const c=LEER.find(x=>x.id===b.id);if(b.id!=='eind'&&!c)return null;return{b,naam:b.id==='eind'?'Eindtoets':'Hoofdstuk '+(LEER.indexOf(c)+1)+' · '+c.t,nr:Math.min(b.qs.length,(b.i||0)+(b.ans!=null?1:0)),n:b.qs.length}}
function resumeQuiz(){const b=APP.th&&APP.th.data&&APP.th.data.bezig;if(!b)return;try{const qs=b.qs.map(([ch,k,o])=>{const c=LEER.find(x=>x.id===ch);const v=c&&c.v[k];if(!v)throw 0;return mkQ(qOf(c,v,k),o)});const c=LEER.find(x=>x.id===b.id);
  LQ={id:b.id,title:b.id==='eind'?EIND.t:c.t,qs,i:Math.min(b.i||0,qs.length-1),score:b.score||0,combo:b.combo||0,best:b.best||0,ans:b.ans==null?null:b.ans,fout:b.fout||[]};LV.v='quiz';renderLeer();leerScroll()}
  catch(e){delete APP.th.data.bezig;thSave();toast('Deze quiz kon niet worden hervat. Begin opnieuw.',true);renderLeer()}}
function viewQuiz(){const q=LQ.qs[LQ.i],n=LQ.qs.length,a=LQ.ans;const chI=LEER.findIndex(c=>c.id===q.ch);
  let h='<div class="lbar"><button type="button" class="btn soft sm" data-lact="stop">Stoppen</button><span class="lcrumb">'+esc(LQ.id==='eind'?'Eindtoets':'Hoofdstuk '+(chI+1)+' · '+LQ.title)+'</span><span class="combo'+(LQ.combo>=3?' hot':'')+'" aria-live="polite">'+(LQ.combo>=2?LQ.combo+' goed op rij':'')+'</span></div>';
  h+='<div class="qprog"><div class="qbar" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+(LQ.i+(a!=null?1:0))+'" aria-label="Voortgang quiz"><span style="width:'+Math.round((LQ.i+(a!=null?1:0))/n*100)+'%"></span></div><span>Vraag '+(LQ.i+1)+' van '+n+'</span></div>';
  h+='<section class="qcard"><h2 id="qText">'+esc(q.q)+'</h2><div class="qopts" role="group" aria-labelledby="qText">'+q.opts.map((o,k)=>{let cls='qopt';if(a!=null){if(k===q.goed)cls+=' good';else if(k===a)cls+=' bad';else cls+=' dim'}return'<button type="button" class="'+cls+'" data-q="'+k+'"'+(a!=null?' disabled':'')+'><span class="ql" aria-hidden="true">'+'ABCD'[k]+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div>';
  if(a!=null){const good=a===q.goed;h+='<div class="qfb '+(good?'good':'bad')+'" role="status"><b>'+(good?(LQ.combo>=3?'Goed! '+LQ.combo+' op rij.':'Goed!'):'Helaas, dat is niet goed.')+'</b><p>'+esc(q.u)+'</p><small>Theorieboek p. '+q.p+'</small></div><div class="qnext"><button type="button" class="btn primary" data-lact="next" id="qNext">'+(LQ.i+1<n?'Volgende vraag':'Bekijk je resultaat')+'</button></div>'}
  h+='</section><p class="note small kbd-tip">Tip: je kunt ook antwoorden met de toetsen A, B, C, D en doorgaan met Enter.</p>';return h}
function answer(k){if(!LQ||LQ.ans!=null)return;const q=LQ.qs[LQ.i];LQ.ans=k;if(k===q.goed){LQ.score++;LQ.combo++;LQ.best=Math.max(LQ.best,LQ.combo)}else{LQ.combo=0;LQ.fout.push({q:q.q,goed:q.opts[q.goed],jij:q.opts[k],p:q.p})}saveBezig();renderLeer();setTimeout(()=>{const b=$('#qNext');if(b)b.focus()},30)}
async function nextQ(){if(!LQ||LQ.ans==null)return;if(LQ.i+1<LQ.qs.length){LQ.i++;LQ.ans=null;renderLeer();setTimeout(()=>{const b=$('#leer .qopt');if(b)b.focus()},30);return}await finishQuiz()}
async function finishQuiz(){const th=APP.th;delete th.data.bezig;const n=LQ.qs.length,s=LQ.score,pct=s/n;const xp0=thXP(th.data),rk0=rankOf(xp0).i;const wasDone=theoryDone();let prev;
  if(LQ.id==='eind'){prev=th.data.eind;th.data.eind={best:Math.max(s,prev?prev.best:0),van:n,n:(prev?prev.n:0)+1,op:nowIso(),laatste:s};if(pct>=EIND.pass&&!th.geslaagd_op)th.geslaagd_op=nowIso()}
  else{prev=th.data.h[LQ.id];const keep=prev&&pctOf(prev)>pct;th.data.h[LQ.id]=Object.assign({},prev||{},{best:keep?prev.best:s,van:keep?prev.van:n,n:((prev&&prev.n)||0)+1,op:nowIso(),laatste:s})}
  const xp1=thXP(th.data);LQ.res={s,n,pct,pass:pct>=(LQ.id==='eind'?EIND.pass:LEER_PASS),dxp:xp1-xp0,rankUp:rankOf(xp1).i>rk0?rankOf(xp1).naam:null,nieuwDoor:!wasDone&&theoryDone(),stars:LQ.id==='eind'?0:starsOf({best:s,van:n})};
  LV.v='klaar';renderLeer();leerScroll();renderTop();await thSave()}
function viewKlaar(){const r=LQ.res,eind=LQ.id==='eind';const i=LEER.findIndex(c=>c.id===LQ.id);const nxt=!eind&&r.pass?(i+1<LEER.length?LEER[i+1]:'eind'):null;
  let h='<section class="qres '+(r.pass?'pass':'fail')+'">'+(r.pass?'<div class="confetti" aria-hidden="true">'+Array.from({length:22},(_,k)=>'<i style="--x:'+(Math.round(Math.random()*200-100))+'px;--r:'+Math.round(Math.random()*360)+'deg;--d:'+(k%5)*60+'ms;--c:'+['var(--accent)','var(--blue)','var(--ok)','#f4c542'][k%4]+'"></i>').join('')+'</div>':'')+
    '<div class="eyebrow">'+esc(eind?'Eindtoets':'Hoofdstuk '+(i+1)+' · '+LQ.title)+'</div><div class="qscore">'+r.s+'<small>/'+r.n+'</small></div>'+(eind?'':starRow(r.stars,true))+
    '<h1>'+(r.nieuwDoor?'Theorie gehaald! Je casus is open.':r.pass?(eind?'Eindtoets gehaald!':r.s===r.n?'Foutloos!':'Hoofdstuk gehaald!'):'Nog niet gehaald')+'</h1><p>'+(r.pass?(eind?'Knap gedaan. Je kunt nu aan je casus voor praktijktoets 3 beginnen.':'Je hebt '+Math.round(r.pct*100)+'% goed. '+(nxt==='eind'?'Alle hoofdstukken zijn gehaald: de eindtoets is open.':nxt?'Hoofdstuk '+(i+2)+' is open.':'')):'Je hebt '+Math.round(r.pct*100)+'% goed; je hebt 80% nodig. Lees de les nog eens door en probeer het opnieuw.')+'</p>'+
    (r.dxp>0?'<div class="xpgain">+'+r.dxp+' XP</div>':'')+(r.rankUp?'<div class="rankup">Nieuwe rang: <b>'+esc(r.rankUp)+'</b></div>':'')+
    '<div class="row qres-a">'+(r.nieuwDoor&&!isPreview()?'<button type="button" class="btn primary" data-lact="casus">Naar je casus</button>':'')+(nxt&&nxt!=='eind'?'<button type="button" class="btn primary" data-lact="les" data-id="'+nxt.id+'">Naar hoofdstuk '+(i+2)+'</button>':'')+(nxt==='eind'?'<button type="button" class="btn primary" data-lact="quiz" data-id="eind">Start eindtoets</button>':'')+(!r.pass&&!eind?'<button type="button" class="btn primary" data-lact="les" data-id="'+LQ.id+'">Les nog eens lezen</button>':'')+'<button type="button" class="btn" data-lact="quiz" data-id="'+LQ.id+'">'+(r.pass?'Nog een keer':'Opnieuw proberen')+'</button><button type="button" class="btn soft" data-lact="home">Overzicht</button></div></section>';
  if(LQ.fout.length)h+='<section class="lsec"><div class="lsec-h"><h2>Bekijk je fouten</h2></div><ul class="qerr">'+LQ.fout.map(f=>'<li><b>'+esc(f.q)+'</b><span class="bad">Jouw antwoord: '+esc(f.jij)+'</span><span class="good">Goed antwoord: '+esc(f.goed)+'</span><small>Theorieboek p. '+f.p+'</small></li>').join('')+'</ul></section>';
  return h}
$('#leer').addEventListener('click',async e=>{const o=e.target.closest('[data-q]');if(o){answer(+o.dataset.q);return}const g=e.target.closest('[data-gxo]');if(g){gxPick(+g.dataset.gxo);return}const b=e.target.closest('[data-lact]');if(!b)return;const a=b.dataset.lact,id=b.dataset.id;
  if(a==='home'){LV.v='home';LQ=null;renderLeer();leerScroll();navPush({k:'leer',v:'home'})}
  else if(a==='les'){LV.v='les';LV.id=id;LQ=null;renderLeer();leerScroll();navPush({k:'leer',v:'les',id});const r=chRes(id);if(!isPreview()&&!(r&&r.gelezen)){APP.th.data.h[id]=Object.assign({},r||{},{gelezen:true});thSave()}}
  else if(a==='gx')gxAct(b);
  else if(a==='tj')trajectMelden(b.dataset.stap,b.dataset.aan==='1');
  else if(a==='ics')trajectIcs();
  else if(a==='mod')modOpen(id);
  else if(a==='extra'){LV.v='extra';LV.id=id;LQ=null;GXV.v='home';GXV.q=null;renderLeer();leerScroll();navPush({k:'leer',v:'extra',id})}
  else if(a==='quiz')startQuiz(id);
  else if(a==='resume')resumeQuiz();
  else if(a==='next')nextQ();
  else if(a==='stop'){const y=LQ&&LQ.i===0&&LQ.ans==null?true:await confirmBox('Quiz stoppen?','Je antwoorden van deze poging vervallen. Wil je later verder? Ga dan gewoon naar het overzicht; je voortgang is opgeslagen.','Stoppen');if(y){if(APP.th&&APP.th.data.bezig){delete APP.th.data.bezig;thSave()}LV.v=LQ&&LQ.id!=='eind'?'les':'home';LV.id=LQ&&LQ.id;LQ=null;renderLeer();leerScroll()}}
  else if(a==='casus'&&APP.lid&&casusOpen())openCasus(APP.lid.id,'kandidaat')});
document.addEventListener('keydown',e=>{if(APP.mode!=='leer'||LV.v!=='quiz'||!LQ||!$('#modal').hidden||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toUpperCase();const i='ABCD'.indexOf(k);
  if(i>=0&&k.length===1&&LQ.ans==null){e.preventDefault();answer(i)}else if(e.key==='Enter'&&LQ.ans!=null&&!(e.target&&e.target.closest&&e.target.closest('button'))){e.preventDefault();nextQ()}});

function thCell(r){const t=r.th,ok=t&&t.geslaagd_op,n=(t&&t.hoofdstukken)||0;

async function showTheorie(r){const t=r.th||{},d=t.data||{h:{}},ok=!!t.geslaagd_op;const xp=t.xp||0,rk=rankOf(xp);const e=d.eind;

    LEER.map((c,i)=>{const res=d.h&&d.h[c.id];return row((i+1)+'. '+esc(c.t),res,res&&res.van?starRow(starsOf(res)):'')}).join('')+row('<b>Eindtoets</b>',e,e&&e.van?(pctOf(e)>=EIND.pass?'<span class="pill ok">gehaald</span>':'<span class="pill acc">niet gehaald</span>'):'')+'</tbody></table></div></div>';
  if(ok||APP.isLm||!LEER_GATE){await modalBox('Theorie van '+r.naam,'',body,'Sluiten',null);return}

function tjCfg(st){const g=typeof gebiedVan==='function'?gebiedVan(st||'amsterdam'):null,tr=(g&&g.traject)||{},tm=tr.termijnen||{};const c=Object.assign({},TJ);
  Object.keys(TJ).forEach(k=>{const v=Number(tm[k]);if(Number.isFinite(v)&&v>=0&&v<=365)c[k]=Math.round(v)});
  c.basis=tr.basis==='examen'?'examen':'generale';c.vrij=tr.vrij!==false;c.stappen=Array.isArray(tr.stappen)?tr.stappen.filter(x=>x&&x.id&&x.titel):[];return c}

const dParse=s=>{if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const dIso=d=>d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';

function traject(r){const g=groepOf(r),c=tjCfg(r.stad);const exam=dParse(r.examen_op)||dParse(g&&g.examen_op),gen=dParse(r.generale_op)||dParse(g&&g.generale_op);
  const basis=c.basis==='examen'?exam:(gen||exam),casusDl=basis?dAdd(basis,-c.casusDagen):null,vrijDl=basis?dAdd(basis,-c.vrijDagen):null,verstuurDl=basis?dAdd(basis,-c.verstuurDagen):null;
  const casusOk=r.status==='ingeleverd'||r.status==='geslaagd',vrijNodig=c.vrij&&r.vrij_nodig!==false,vrijOk=!vrijNodig||!!r.vrij_geregistreerd_op;

  const t={g,c,exam,gen,basisGen:c.basis!=='examen'&&!!gen,basisNaam:c.basis==='examen'||!gen?'examen':'generale',casusDl,vrijDl,verstuurDl,casusOk,vrijNodig,vrijOk,extra,acties:[]};
  if(r.status==='geslaagd'||!exam)return t;

function mijnTraject(){const pv=isPreview();if(!pv&&(!TRAJECT_KANDIDAAT||APP.isStaff||APP.isLm))return'';const r=pv?trajectVoorbeeld():APP.lid;if(!r)return'';const t=traject(r);const today=dToday();

function trajectIcs(){const r=isPreview()?trajectVoorbeeld():APP.lid,t=traject(r);if(!t.exam)return;const ds=d=>dIso(d).replace(/-/g,''),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');

  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SOR-traject.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

  const P=cover?{land:'#f4f8fa',water:'#d6e8f0',edge:'#c3dbe6'}:{land:'#f2efe9',water:'#aad3df',edge:'#96c3d3',label:'#3c6e8f',street:'#ffffff',casing:'#d6cec2',pri:'#fcd6a4',sec:'#f7fabf',slabel:'#555b64'};

  drawSt('casing');drawSt('fill');

  c.font='400 '+Math.round(fs*0.8)+'px "Atkinson Hyperlegible", Arial, sans-serif';c.fillStyle=P.slabel;

  const n=doc.getNumberOfPages();for(let i=2;i<=n;i++){doc.setPage(i);if(LOGO.s)doc.addImage(LOGO.s,'PNG',W-M-7,4,7,7);font(8.5,'normal',MUT);doc.text('Casus praktijktoets 3 SOR',W/2,9.5,{align:'center'});doc.text(clean(k.naam||''),M,9.5);doc.text(String(i),W/2,H-8,{align:'center'});doc.setDrawColor(...LINE);doc.setLineWidth(0.25);doc.line(M,12.5,W-M,12.5)}
  return doc.output('blob')}
let pdfBusy=false;
async function cvoDataUrl(id){try{const r=await fetch(CITY.assets+'assets/cvo/'+id+'.jpg');if(!r.ok)return null;const b=await r.blob();return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)})}catch(e){return null}}
async function downloadPdf(){if(pdfBusy)return;pdfBusy=true;const btn=$('#btnPdf');if(btn){btn.disabled=true;btn.textContent='PDF maken…'}try{const blob=await buildPdf();await saveFile('Casus SOR praktijktoets 3 '+safeName(state.kandidaat.naam)+'.pdf',blob)}catch(e){console.error(e);toast(e&&e.message==='lib'?'De PDF-bibliotheek is niet geladen. Controleer je internetverbinding en herlaad de pagina.':'Het maken van de PDF is mislukt.',true)}finally{pdfBusy=false;if(btn){btn.disabled=false;btn.textContent='PDF downloaden'}}}

/* ---------- theme & init ---------- */
const mq=window.matchMedia('(prefers-color-scheme: dark)');const retheme=()=>{styleMap();if(APP.mode==='edit')drawAll()};
if(mq.addEventListener)mq.addEventListener('change',retheme);
new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('resize',()=>map.invalidateSize());
window.addEventListener('beforeunload',()=>{if(APP.dirty.size)flush()});
/* item in de lijst aanklikken -> uitlichten op de kaart */
var SEL=null;let spotLayer=null,spotT=null;
function spotlight(pos,label,zoom){if(!pos)return;const ll=toLL(pos);const inView=map.getBounds().pad(-0.12).contains(ll);if(zoom||!inView)map.flyTo(ll,Math.max(map.getZoom(),17),{duration:0.55});
  if(spotLayer)map.removeLayer(spotLayer);clearTimeout(spotT);spotLayer=L.marker(ll,{interactive:false,keyboard:false,zIndexOffset:2000,icon:L.divIcon({className:'',html:'<span class="spot"></span>',iconSize:[64,64],iconAnchor:[32,32]})}).addTo(map);
  if(label)spotLayer.bindTooltip(label,{permanent:true,direction:'top',offset:[0,-30],className:'spot-tip'}).openTooltip();
  spotT=setTimeout(()=>{if(spotLayer){map.removeLayer(spotLayer);spotLayer=null}},3200)}
function spotFor(el){if(el.dataset.aid){const a=state.aandacht.find(x=>x.id===el.dataset.aid);return a&&a.pos?[a.pos,a.titel||(a.cat&&a.cat.length?catName(a.cat[0]):'Aandachtspunt')]:null}
  if(el.dataset.mid){const m=state.meldpunten.find(x=>x.id===el.dataset.mid);return m&&m.pos?[m.pos,m.melding||'Meldpunt']:null}
  if(el.dataset.sid){const b=state.borden.find(x=>x.id===el.dataset.sid);return b&&b.pos?[b.pos,b.locatie||'Bord']:null}
  if(el.dataset.man){const x=state.manoeuvres[el.dataset.man];const M=MANS.find(q=>q.k===el.dataset.man);return x&&x.pos?[x.pos,M?M.t:'Manoeuvre']:null}
  if(el.dataset.brow){const f=R&&R.bridges.find(q=>q.br.key===el.dataset.brow);return f?[[f.br.x,f.br.y],bridgeLabel(f.br)]:null}
  return null}
/* het aangeklikte item ook in de lijst oranje markeren */
function selOf(el){for(const k of ['aid','mid','sid','man','brow']){if(el.dataset[k]!=null){const a='data-'+(k==='brow'?'brow':k);return'['+a+'="'+el.dataset[k]+'"]'}}return null}
function applySel(){$$('.sel',panel).forEach(x=>x.classList.remove('sel'));if(!SEL)return;const el=panel.querySelector(SEL);if(el)el.classList.add('sel')}
function selectEl(el){SEL=selOf(el);applySel()}
const _renderPanel=renderPanel;renderPanel=function(){_renderPanel();applySel()};
panel.addEventListener('click',e=>{if(e.target.closest('button,select,a,input,.btn,[data-act$="-del"]'))return;const c=e.target.closest('[data-aid],[data-mid],[data-sid],[data-man],[data-brow]');if(!c)return;selectEl(c);const sp=spotFor(c);if(sp)spotlight(sp[0],sp[1],false)});
panel.addEventListener('click',e=>{const b=e.target.closest('[data-act$="-zoom"]');if(!b)return;e.stopImmediatePropagation();const c=b.closest('[data-aid],[data-mid],[data-sid],[data-man]');if(c)selectEl(c);const sp=c&&spotFor(c);if(sp)spotlight(sp[0],sp[1],true)},true);
document.addEventListener('click',e=>{const a=e.target.closest('[data-rws]');if(!a)return;copyText(a.dataset.rws).then(ok=>{if(ok)toast('“'+a.dataset.rws+'” gekopieerd. Plak de naam in het zoekveld van Rijkswaterstaat.')})});
if(!CITY.marifoon){delete HINTS.marifoon;const lg=[...document.querySelectorAll('.map-legend span')].find(x=>/Meldpunt/.test(x.textContent));if(lg)lg.remove()}
styleMap();zoomClasses();
initPlatform();
window.__casus={buildPdf,state:()=>state,route:()=>R,checks:()=>CHECKS,app:APP};
})();
</script>
