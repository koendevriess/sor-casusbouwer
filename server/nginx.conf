# SOR Casusbouwer – voorbeeld voor nginx (in het server-blok van het domein)
# root wijst naar de bouwmap (uitvoer van: python3 bouw.py)
root /var/www/sor-casusbouwer;
index index.html;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Bestaande gebieden zijn mappen met een index.html. Een nieuw vaargebied (/<gebied>/) bestaat niet als map:
# dan levert 404.html de algemene casusbouwer, die het gebied uit de database laadt.
location ~ "^/[a-z][a-z0-9-]{1,30}/$" {
    try_files $uri/index.html /404.html;
    expires -1;
}
location / {
    try_files $uri $uri/ =404;
}
error_page 404 /404.html;
location ~* \.html$ { expires -1; }
location /assets/ { expires 7d; }

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
